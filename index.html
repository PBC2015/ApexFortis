          <div class="sf" style="flex:1"><label>${wLabel(ss)}</label>
            <input type="number" inputmode="decimal" value="${sb_.weight}" placeholder="0"
              oninput="updSS('${cid}',${sess.week},${sess.day},'${ex.id}',${si},'weight',this.value)">
          </div>
          <div class="sf" style="flex:1"><label>${metricLbl(bMetric)}</label>
            <input type="number" inputmode="numeric" value="${sb_.reps}" placeholder="0"
              oninput="updSS('${cid}',${sess.week},${sess.day},'${ex.id}',${si},'reps',this.value)">

        </div>

    </div>
    <div style="display:flex;gap:6px;margin-bottom:8px">
      <div class="sf" style="flex:1"><label>Rest after pair ${si+1}</label>

          oninput="upd('${cid}',${sess.week},${sess.day},'${ex.id}',${si},'rest',this.value)">
      </div>
    </div>`;
  });
  const lastSa=ex.sets[ex.sets.length-1];
  const lastRest=lastSa?.rest?fmtS(parseInt(lastSa.rest)||parseRest(lastSa.rest)):fmtS(S.defRest||60);
  h+=`<div style="display:flex;gap:6px;margin-top:8px">
    <button class="rest-btn" style="flex:1;margin-top:0" onclick="startRest('${cid}',${sess.week},${sess.day},'${ex.id}',${ex.sets.length-1})">⏱ Rest · ${lastRest}</button>
    <button class="pr-btn" title="Log A as PR" onclick="logSetAsPR('${ex.name}','${cid}',${sess.week},${sess.day},'${ex.id}',${ex.sets.length-1})">🏆</button>
  </div>
  <button class="btn btns" style="width:100%;margin-top:4px" onclick="addSet('${cid}',${sess.week},${sess.day},'${ex.id}')">+ Add Set (A + B)</button>
  <button class="btn btns" style="width:100%;margin-top:8px;${exDelPending[ex.id]?'color:#e06060;border-color:#c04040':''}" onclick="removeExFromSession('${cid}',${sess.week},${sess.day},'${ex.id}')">
    ${exDelPending[ex.id]?'⚠ Confirm Remove?':'− Remove Exercise'}
  </button>
  </div></div>`;
  return h;
}

function ruDist(){return S.ruckUnit==='km'?'km':'mi';}
function setRuckUnit(u){
  if(S.ruckUnit===u)return;
  const factor=u==='km'?1.60934:(1/1.60934); // mi->km multiply, km->mi divide
  S.cycles.forEach(c=>c.sessions.forEach(s=>{
    if(s.type==='ruck'&&s.ruckData&&parseFloat(s.ruckData.distance)>0){
      const n=parseFloat(s.ruckData.distance);
      s.ruckData.distance=String(Math.round(n*factor*100)/100);
    }
  }));
  S.ruckUnit=u;save();rv();
}

// ─── TRAINING MUTATIONS ───────────────────────────────────────────────────────
function gEx(cid,w,d,eid){
  const c=S.cycles.find(x=>x.id===cid);if(!c)return null;
  const s=c.sessions.find(s=>s.week===w&&s.day===d);if(!s)return null;
  return s.exercises.find(e=>e.id===eid);
}
function refreshOrm(cid,w,d,eid){
  const ex=gEx(cid,w,d,eid);if(!ex||ex.metric&&ex.metric!=='reps')return;
  const badge=document.getElementById('orm-'+eid);if(!badge)return;
  const best=getBest1RM(ex.libId);
  if(best){badge.textContent='≈1RM '+best+uw();badge.style.display='';}
  else badge.style.display='none';
}
function upd(cid,w,d,eid,si,f,v){
  const ex=gEx(cid,w,d,eid);if(!ex||!ex.sets[si])return;
  ex.sets[si][f]=v;save();
  if(f==='weight'||f==='reps')refreshOrm(cid,w,d,eid);
}
function prCheck(name,cid,w,d,eid,si){
  const ex=gEx(cid,w,d,eid);if(!ex||!ex.sets[si])return;
  const s=ex.sets[si];if(s.failed)return;
  detectPR(name,s.weight,s.reps,s.notes||'');
}
function addSet(cid,w,d,eid){
  const ex=gEx(cid,w,d,eid);if(!ex)return;
  const p=ex.sets[ex.sets.length-1]||{};
  ex.sets.push({...mkSet(),weight:'',rest:p.rest||'',equipment:p.equipment||''});
  if(ex.supersetWith)ex.supersetWith.sets.push(mkSet());
  save();rv();
}
function rmSet(cid,w,d,eid,si){
  const ex=gEx(cid,w,d,eid);if(!ex)return;
  ex.sets.splice(si,1);
  if(!ex.sets.length)ex.sets=[mkSet()];
  if(ex.supersetWith){ex.supersetWith.sets.splice(si,1);if(!ex.supersetWith.sets.length)ex.supersetWith.sets=[mkSet()];}
  save();rv();
}
function updR(cid,w,f,v){
  const c=S.cycles.find(x=>x.id===cid);if(!c)return;
  const s=c.sessions.find(s=>s.week===w&&s.type==='ruck');if(!s)return;
  if(!s.ruckData)s.ruckData={};s.ruckData[f]=v;save();
}
function updSessNotes(cid,w,d,v){
  const c=S.cycles.find(x=>x.id===cid);if(!c)return;
  const s=c.sessions.find(s=>s.week===w&&s.day===d);if(!s)return;s.notes=v;save();
}
function setWk(w){S.wk=w;showCompare=false;save();rv();}
function setDy(d){S.dy=d;showCompare=false;save();rv();}
function nxtDay(){
  const cyc=S.cycles.find(c=>c.id===S.cid);if(!cyc)return;
  const mx=maxDay(cyc);
  if(S.dy<mx)S.dy++;else if(S.wk<cyc.weeks-1){S.wk++;S.dy=0;}
  showCompare=false;save();rv();
}
function prvDay(){
  const cyc=S.cycles.find(c=>c.id===S.cid);
  const mx=cyc?maxDay(cyc):3;
  if(S.dy>0)S.dy--;else if(S.wk>0){S.wk--;S.dy=mx;}
  showCompare=false;save();rv();
}

function vStats(c){

function setStT(t){S.stTab=t;save();rv();}
function stRender(cyc){
  const el=document.getElementById('stcont');if(!el)return;

function stOver(el,cyc){
  const mainExs=cyc.sessions.flatMap(s=>(s.exercises||[]).filter(e=>MAIN_SKILLS.has(e.skill)));

  const meSets=cyc.sessions.flatMap(s=>(s.exercises||[]).filter(e=>e.role==='main').flatMap(e=>effSets(e)));
  const bME=meSets.reduce((a,b)=>(parseFloat(b.weight)||0)>(parseFloat(a.weight)||0)?b:a,{weight:0});

  <div class="sgrid">
    <div class="stc"><div class="stv">${done}<span style="font-size:14px;color:var(--t2)">/${cyc.sessions.length}</span></div><div class="stl">Done</div></div>
    <div class="stc"><div class="stv">${vTonnes(tV)}</div><div class="stl">Volume</div></div>
    <div class="stc"><div class="stv" style="font-size:${bME.weight?'20':'16'}px">${bME.weight?bME.weight+uw():'—'}</div><div class="stl">Best Top Set</div></div>
    <div class="stc"><div class="stv" style="font-size:${bR?'20':'16'}px">${bR?bR+ruDist():'—'}</div><div class="stl">Best Ruck</div></div>
  </div>
  <div class="card">
    <div class="fbet mb8"><div class="lbl">Cycle Progress</div><span style="font-family:var(--fn);font-size:14px;font-weight:700;color:var(--g2)">${pct}%</span></div>
    <div class="prog-bar" style="height:12px"><div class="prog-fill" style="width:${pct}%"></div></div>
    <div style="display:grid;grid-template-columns:repeat(${cyc.weeks},1fr);gap:4px;margin-top:10px">
      ${Array.from({length:cyc.weeks},(_,w)=>{
        const wd=cyc.sessions.filter(s=>s.week===w&&s.done).length;
        const wt=cyc.sessions.filter(s=>s.week===w).length;
        const dl=isDeload(S.cid,w);
        return`<div style="text-align:center"><div style="font-family:var(--fn);font-size:10px;color:var(--t2);margin-bottom:2px">W${w+1}${dl?' ↓':''}</div><div style="font-family:var(--fn);font-size:14px;font-weight:700;color:${wd===wt?'var(--green)':'var(--t2)'}">${wd}/${wt}</div></div>`;
      }).join('')}
    </div>
  </div>`;
}
function stVol(el,cyc){
  const exNames=[...new Set(cyc.sessions.flatMap(s=>(s.exercises||[]).map(e=>e.name)))].filter(Boolean).sort();
  const selEx=S.stEx&&exNames.includes(S.stEx)?S.stEx:(exNames[0]||'');
  const wD=Array.from({length:cyc.weeks},(_,w)=>({w:w+1,v:cyc.sessions.filter(s=>s.week===w&&s.type!=='ruck').flatMap(s=>(s.exercises||[]).filter(e=>MAIN_SKILLS.has(e.skill))).reduce((t,e)=>t+exVol(e),0)}));
  const mWV=Math.max(...wD.map(d=>d.v),1);
  const Ww=Math.max(200,cyc.weeks*80),Hw=120,bww=Math.min(50,Ww/cyc.weeks-12),cHw=80,pTw=16;
  const wBars=wD.map((d,i)=>{
    const bh=Math.max(2,(d.v/mWV)*cHw),x=i*(Ww/cyc.weeks)+(Ww/cyc.weeks-bww)/2,y=pTw+cHw-bh;
    const vs=d.v>0?vTonnes(d.v):'';
    return`<g><rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bww}" height="${bh.toFixed(1)}" fill="var(--gd)" rx="4"/>
      ${d.v>0?`<text x="${(x+bww/2).toFixed(1)}" y="${(y-4).toFixed(1)}" fill="var(--t2)" font-size="9" text-anchor="middle" font-family="Barlow Condensed">${vs}</text>`:''}
      <text x="${(x+bww/2).toFixed(1)}" y="${(Hw-6).toFixed(1)}" fill="var(--t2)" font-size="12" text-anchor="middle" font-family="Barlow Condensed" font-weight="700">W${d.w}</text></g>`;
  }).join('');
  el.innerHTML=`<div class="card"><div class="lbl mb8">Week Volume Comparison</div>
    <svg width="${Ww}" height="${Hw}" viewBox="0 0 ${Ww} ${Hw}" style="display:block;width:100%">
      <line x1="0" y1="${pTw+cHw}" x2="${Ww}" y2="${pTw+cHw}" stroke="var(--b)" stroke-width="1"/>${wBars}
    </svg></div>
  <div class="card"><div class="lbl mb8">Exercise Volume</div>
    <select id="stex" onchange="setStEx(this.value)" class="mb12">${exNames.map(n=>`<option value="${n}" ${n===selEx?'selected':''}>${n}</option>`).join('')}</select>
    <div id="vchart"></div></div>`;
  if(selEx)rVChart(selEx,cyc);
}
function setStEx(n){S.stEx=n;save();rv();}
function rVChart(name,cyc){
  const el=document.getElementById('vchart');if(!el)return;
  const data=[];
  cyc.sessions.forEach(s=>(s.exercises||[]).filter(e=>e.name===name).forEach(e=>{
    const v=exVol(e);
    const eff=effSets(e);
    const bk=Math.max(0,...eff.map(st=>parseFloat(st.weight)||0));
    data.push({lbl:`W${s.week+1}D${s.day+1}`,v,bk});
  }));
  if(!data.length){el.innerHTML='<div class="chart-empty">No data logged yet</div>';return;}
  const mV=Math.max(...data.map(d=>d.v),1);
  const W=Math.max(280,data.length*52),H=140,cW=W-20,cH=100,pT=14,bw=Math.min(36,(cW/data.length)-8);
  const bars=data.map((d,i)=>{
    const bh=Math.max(2,(d.v/mV)*cH),x=10+(i*(cW/data.length))+(cW/data.length-bw)/2,y=pT+cH-bh;
    const vs=d.v>0?vTonnes(d.v):'';
    return`<g><rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw}" height="${bh.toFixed(1)}" fill="var(--gd)" rx="3"/>
      ${d.v>0?`<text x="${(x+bw/2).toFixed(1)}" y="${(y-4).toFixed(1)}" fill="var(--t2)" font-size="9" text-anchor="middle" font-family="Barlow Condensed">${vs}</text>`:''}
      ${d.bk>0?`<text x="${(x+bw/2).toFixed(1)}" y="${(H-20).toFixed(1)}" fill="var(--g2)" font-size="9" text-anchor="middle" font-family="Barlow Condensed">${d.bk}${uw()}</text>`:''}
      <text x="${(x+bw/2).toFixed(1)}" y="${(H-6).toFixed(1)}" fill="var(--t2)" font-size="9" text-anchor="middle" font-family="Barlow Condensed">${d.lbl}</text></g>`;
  }).join('');
  el.innerHTML=`<div class="scrollx"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block">
    <line x1="10" y1="${pT+cH}" x2="${W-10}" y2="${pT+cH}" stroke="var(--b)" stroke-width="1"/>${bars}
  </svg></div>`;
}
function parseDuration(str){
  if(!str)return 0;
  str=String(str).trim().toLowerCase();
  if(str.includes(':')){const p=str.split(':');return(parseInt(p[0])||0)*60+(parseInt(p[1])||0);}
  const hM=str.match(/(\d+(?:\.\d+)?)\s*h/),mM=str.match(/(\d+(?:\.\d+)?)\s*m/);
  if(hM||mM)return(hM?parseFloat(hM[1])*60:0)+(mM?parseFloat(mM[1]):0);
  const n=parseFloat(str);
  return isNaN(n)?0:n;
}
function jumpToCycleDay(cid,w,d){
  S.cid=cid;S.tab='train';S.wk=w;S.dy=d;save();render();
}
function stCycle(el,cyc){
  const sTypeLbl={long:'Long',short:'Short',full:'Full',ruck:'Ruck'};
  const weeks=Array.from({length:cyc.weeks},(_,w)=>w);
  function dayBlock(w,sess){
    const lbl=sTypeLbl[sess.type]||sess.type;
    if(sess.type==='ruck'){
      return`<div class="cyov-day" onclick="jumpToCycleDay('${cyc.id}',${w},${sess.day})">
        <div class="cyov-daylbl">Day ${sess.day+1} · ${lbl}</div>
      </div>`;
    }
    const sorted=[...sess.exercises].sort((a,b)=>(a.sortOrder??exSkillOrder(a))-(b.sortOrder??exSkillOrder(b)));
    const exNames=sorted.map(e=>`<div class="cyov-ex">${e.name}</div>`).join('');
    return`<div class="cyov-day" onclick="jumpToCycleDay('${cyc.id}',${w},${sess.day})">
      <div class="cyov-daylbl">Day ${sess.day+1} · ${lbl}</div>
      ${exNames||'<div class="cyov-ex" style="opacity:.5">No exercises</div>'}
    </div>`;
  }
  function weekCol(w){
    const sess=cyc.sessions.filter(s=>s.week===w).sort((a,b)=>a.day-b.day);
    return`<div class="cyov-week">
      <div class="cyov-weeklbl">Week ${w+1}</div>
      ${sess.map(s=>dayBlock(w,s)).join('')}
    </div>`;
  }
  let rows='';
  for(let i=0;i<weeks.length;i+=2){
    const left=weekCol(weeks[i]);
    const right=weeks[i+1]!=null?weekCol(weeks[i+1]):'<div class="cyov-week"></div>';
    rows+=`<div class="cyov-row">${left}${right}</div>`;
  }
  el.innerHTML=`<div class="card" style="padding:10px">${rows}</div>`;
}
function stRuck(el,cyc){
  const rucks=cyc.sessions.filter(s=>s.type==='ruck').map(s=>({
    w:s.week+1,dist:parseFloat(s.ruckData?.distance)||0,
    weight:parseFloat(s.ruckData?.weight)||0,dur:s.ruckData?.duration||'',
    durMin:parseDuration(s.ruckData?.duration),notes:s.ruckData?.notes||''
  }));
  const hD=rucks.some(r=>r.dist>0);
  let chart='<div class="chart-empty">No ruck data logged yet</div>';
  if(hD){
    // Standard reference: 3mi / 40kg / 1hr — all bars even at these values
    const STD_DIST=S.ruckUnit==='km'?3*1.60934:3;
    const STD_WEIGHT=uw()==='lbs'?40*2.20462:40;
    const STD_DUR=60;
    const W=Math.max(260,rucks.length*100),H=130,bw=Math.min(46,(W/rucks.length)-12),cH=90,pT=14,pB=26;
    const bars=rucks.map((r,i)=>{
      const dh=Math.max(2,Math.min(cH,(r.dist/STD_DIST)*cH));
      const wh=Math.max(2,Math.min(cH,(r.weight/STD_WEIGHT)*cH));
      const durH=Math.max(2,Math.min(cH,(r.durMin/STD_DUR)*cH));
      const x=i*(W/rucks.length)+(W/rucks.length-bw)/2;
      const seg=bw/3;
      return`<g>
        <rect x="${x.toFixed(1)}" y="${(pT+cH-dh).toFixed(1)}" width="${(seg*.62).toFixed(1)}" height="${dh.toFixed(1)}" fill="var(--gd)" rx="2"/>
        <rect x="${(x+seg).toFixed(1)}" y="${(pT+cH-wh).toFixed(1)}" width="${(seg*.62).toFixed(1)}" height="${wh.toFixed(1)}" fill="var(--bg5)" rx="2"/>
        <rect x="${(x+seg*2).toFixed(1)}" y="${(pT+cH-durH).toFixed(1)}" width="${(seg*.62).toFixed(1)}" height="${durH.toFixed(1)}" fill="var(--green)" rx="2"/>
        ${r.dist>0?`<text x="${(x+seg*.31).toFixed(1)}" y="${(pT+cH-dh-4).toFixed(1)}" fill="var(--g)" font-size="8" text-anchor="middle" font-family="Barlow Condensed">${r.dist}${ruDist()}</text>`:''}
        ${r.weight>0?`<text x="${(x+seg*1.31).toFixed(1)}" y="${(pT+cH-wh-4).toFixed(1)}" fill="var(--t2)" font-size="8" text-anchor="middle" font-family="Barlow Condensed">${r.weight}${uw()}</text>`:''}
        ${r.durMin>0?`<text x="${(x+seg*2.31).toFixed(1)}" y="${(pT+cH-durH-4).toFixed(1)}" fill="var(--green)" font-size="8" text-anchor="middle" font-family="Barlow Condensed">${r.dur}</text>`:''}
        <text x="${(x+bw/2).toFixed(1)}" y="${(H-pB+12).toFixed(1)}" fill="var(--t2)" font-size="9" text-anchor="middle" font-family="Barlow Condensed">W${r.w}</text>
      </g>`;

function ormTrend(name){
  return S.cycles.map(c=>{
    let best=0,w=0,r=0;
    c.sessions.forEach(s=>(s.exercises||[]).forEach(e=>{
      if(e.name!==name)return;
      if(e.metric&&e.metric!=='reps')return;
      effSets(e).forEach(st=>{
        const rr=parseInt(st.reps);
        if(rr<2||rr>5)return;
        const v=epley(parseFloat(st.weight),rr);
        if(v>best){best=v;w=parseFloat(st.weight)||0;r=rr;}
      });
    }));
    return{cycle:c,best,w,r};
  }).filter(d=>d.best>0);
}
function setOrmEx(n){S.stOrmEx=n;save();rv();}
function rOrmTrend(name){
  const el=document.getElementById('orm-trend-chart');if(!el)return;
  const data=ormTrend(name);
  if(data.length<2){el.innerHTML=`<div class="chart-empty">Need 2+ cycles with logged data for ${name} to show a trend</div>`;return;}
  const mV=Math.max(...data.map(d=>d.best),1);
  const W=Math.max(220,data.length*70),H=130,cW=W-20,cH=88,pT=14,bw=Math.min(40,(cW/data.length)-10);
  const bars=data.map((d,i)=>{
    const bh=Math.max(2,(d.best/mV)*cH),x=10+(i*(cW/data.length))+(cW/data.length-bw)/2,y=pT+cH-bh;
    const label=(d.cycle.name||'C'+(d.cycle.cycleNumber||1)).slice(0,10);
    return`<g><rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw}" height="${bh.toFixed(1)}" fill="var(--gd)" rx="3"/>
      <text x="${(x+bw/2).toFixed(1)}" y="${(y-4).toFixed(1)}" fill="var(--g2)" font-size="10" font-weight="700" text-anchor="middle" font-family="Barlow Condensed">${Math.round(d.best)}${uw()}</text>
      <text x="${(x+bw/2).toFixed(1)}" y="${(H-18).toFixed(1)}" fill="var(--t2)" font-size="9" text-anchor="middle" font-family="Barlow Condensed">${label}</text>
      <text x="${(x+bw/2).toFixed(1)}" y="${(H-6).toFixed(1)}" fill="var(--t2)" font-size="9" text-anchor="middle" font-family="Barlow Condensed">${d.w}${uw()}×${d.r}</text></g>`;
  }).join('');
  const first=data[0].best,last=data[data.length-1].best;
  const diff=last-first,pct=first>0?Math.round(diff/first*100):0;
  const trendNote=diff>0?`<span style="color:var(--green)">▲ +${Math.round(diff)}${uw()} (+${pct}%)</span>`:diff<0?`<span style="color:#e06060">▼ ${Math.round(diff)}${uw()} (${pct}%)</span>`:`<span style="color:var(--t2)">No change</span>`;
  el.innerHTML=`<div class="scrollx"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block">
    <line x1="0" y1="${pT+cH}" x2="${W}" y2="${pT+cH}" stroke="var(--b)" stroke-width="1"/>${bars}
  </svg></div>
  <div style="font-size:12px;color:var(--t2);font-family:var(--fn);margin-top:6px">First → Latest cycle: ${trendNote}</div>`;
}
function stORM(el){

function toggleFail(cid,w,d,eid,si){
  const ex=gEx(cid,w,d,eid);if(!ex||!ex.sets[si])return;
  const s=ex.sets[si];

    s.notes=(s.notes||'').replace(/\s*·\s*Failed\b/i,'').replace(/^Failed\b\s*·?\s*/i,'').trim();

}

function setUnit(newUnit){
  const old=S.unit||'kg';
  if(old===newUnit)return;
  const toLbs=newUnit==='lbs';
  const factor=toLbs?2.20462:1/2.20462;
  function cvt(v){const n=parseFloat(v);if(!n)return v;return String(Math.round(n*factor*10)/10);}
  // Convert all set weights across all cycles
  S.cycles.forEach(cyc=>cyc.sessions.forEach(sess=>{
    (sess.exercises||[]).forEach(ex=>(ex.sets||[]).forEach(s=>{if(s.weight)s.weight=cvt(s.weight);}));
    if(sess.ruckData&&sess.ruckData.weight)sess.ruckData.weight=cvt(sess.ruckData.weight);
  }));
  // Convert PRs
  S.prs.forEach(p=>{if(p.kg)p.kg=Math.round(parseFloat(p.kg)*factor*10)/10;});
  // Convert bodyweight
  if(S.bw)S.bw=cvt(S.bw);
  S.unit=newUnit;save();render();notify('Switched to '+newUnit+' — all values converted');
}
function setDefRest(s){S.defRest=s;save();rv();}
function expData(){
  S.lastExport=new Date().toISOString();
  const a=document.createElement('a');
  a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(S,null,2));
  a.download='simplystrong-backup-'+new Date().toISOString().split('T')[0]+'.json';
  a.click();save();notify('Exported!');rv();
}
function impData(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{try{Object.assign(S,JSON.parse(ev.target.result));save();render();notify('Imported!');}catch(err){notify('Invalid file');}};
  r.readAsText(f);
}

  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  notify('Downloading ApexFortis.html — check your Downloads folder');
  // If running as installed PWA (standalone), Chrome blocks downloads — show guidance
  if(window.matchMedia('(display-mode: standalone)').matches){
    setTimeout(()=>notify('If nothing downloaded: open this app in Chrome browser (not home screen) to download'),2000);
  }
}

// ─── PWA MANIFEST SETUP ───────────────────────────────────────────────────────
function setupPWA(){
  // ── Generate AF logo icon via Canvas ──────────────────────────────────────
  function drawIcon(size){
    const cv=document.createElement('canvas');cv.width=cv.height=size;
    const ctx=cv.getContext('2d');const r=size*0.18;
    // Navy rounded background
    ctx.fillStyle='#0c1828';
    ctx.beginPath();
    ctx.moveTo(r,0);ctx.lineTo(size-r,0);ctx.arcTo(size,0,size,r,r);
    ctx.lineTo(size,size-r);ctx.arcTo(size,size,size-r,size,r);
    ctx.lineTo(r,size);ctx.arcTo(0,size,0,size-r,r);
    ctx.lineTo(0,r);ctx.arcTo(0,0,r,0,r);ctx.closePath();ctx.fill();
    // Thin gold border
    ctx.strokeStyle='rgba(201,168,76,0.55)';ctx.lineWidth=Math.max(2,size*0.022);ctx.stroke();
    // "AF" — bold condensed gold
    ctx.fillStyle='#c9a84c';
    ctx.font=`900 ${Math.round(size*0.5)}px "Barlow Condensed","Arial Narrow",Arial,sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.letterSpacing=`${size*0.015}px`;
    ctx.fillText('AF',size/2,size*0.505);
    return cv;
  }
  try{
    const cv192=drawIcon(192),cv512=drawIcon(512);
    cv192.toBlob(b192=>{
      const u192=URL.createObjectURL(b192);
      cv512.toBlob(b512=>{
        const u512=URL.createObjectURL(b512);
        // PWA manifest
        const manifest={name:'Apex Fortis',short_name:'Apex Fortis',
          description:'Conjugate Strength Training',
          start_url:'.',display:'standalone',
          background_color:'#0c1828',theme_color:'#0c1828',
          orientation:'portrait',
          icons:[
            {src:u192,sizes:'192x192',type:'image/png',purpose:'any maskable'},
            {src:u512,sizes:'512x512',type:'image/png',purpose:'any maskable'}
          ]
        };
        const mBlob=new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});
        const link=document.getElementById('pwa-manifest');
        if(link)link.href=URL.createObjectURL(mBlob);
        // Favicon + apple touch icon
        ['icon','apple-touch-icon'].forEach(rel=>{
          let el=document.querySelector(`link[rel='${rel}']`);
          if(!el){el=document.createElement('link');el.rel=rel;document.head.appendChild(el);}
          el.href=u192;
        });
      },'image/png');
    },'image/png');
  }catch(e){}
  // ── Service worker for offline caching ────────────────────────────────────
  if('serviceWorker' in navigator){
    try{
      const swCode=`
const CV='af-cache-v2';
self.addEventListener('install',e=>{self.skipWaiting();});
self.addEventListener('activate',e=>{e.waitUntil(Promise.all([self.clients.claim(),caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CV).map(k=>caches.delete(k))))]));});
self.addEventListener('fetch',e=>{
  e.respondWith(
    caches.open(CV).then(cache=>
      cache.match(e.request).then(resp=>{
        if(resp)return resp;
        return fetch(e.request).then(nr=>{
          if(nr&&nr.status===200&&e.request.method==='GET')cache.put(e.request,nr.clone());
          return nr;
        }).catch(()=>resp);
      })
    )
  );
});`;
      const swBlob=new Blob([swCode],{type:'application/javascript'});
      navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
    }catch(e){}
  }
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
setupPWA();
render();
