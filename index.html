<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ConstructPro</title>
    <style>
      /* Critical CSS — prevent flash of unstyled content during startup */
      html, body, #root {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        background-color: #F5F4F0;
        color: #1C1C1A;
      }
      /* Prevent text selection during touch drag */
      [data-tauri-drag-region] { -webkit-user-select: none; user-select: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
