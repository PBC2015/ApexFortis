<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0c1828">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Apex Fortis">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Apex Fortis — Conjugate Strength Training">
<title>Apex Fortis</title>
<link id="pwa-manifest" rel="manifest">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='90' fill='%230c1828'/%3E%3Crect x='14' y='14' width='484' height='484' rx='76' fill='none' stroke='%23c9a84c' stroke-width='11' opacity='.6'/%3E%3Ctext x='256' y='345' font-family='Arial Black%2CArial%2Csans-serif' font-size='265' font-weight='900' text-anchor='middle' fill='%23c9a84c'%3EAF%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='90' fill='%230c1828'/%3E%3Crect x='14' y='14' width='484' height='484' rx='76' fill='none' stroke='%23c9a84c' stroke-width='11' opacity='.6'/%3E%3Ctext x='256' y='345' font-family='Arial Black%2CArial%2Csans-serif' font-size='265' font-weight='900' text-anchor='middle' fill='%23c9a84c'%3EAF%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#07101e;overflow:hidden}
:root{
  --bg:#07101e;--bg2:#0c1828;--bg3:#112035;--bg4:#172a42;--bg5:#1e3258;
  --b:#1e3458;--b2:#2a4470;
  --t:#f2ead8;--t2:#9a8870;--t3:#4e4636;
  --g:#c9a84c;--g2:#e8c96a;--g3:#f5dea0;--gd:#7a5e20;--gdk:#4a3810;
  --red:#c85a4a;--green:#4a9a6a;
  --fn:'Barlow Condensed',sans-serif;--fb:'Barlow',sans-serif;
  --sab:env(safe-area-inset-bottom,0px)
}
body{color:var(--t);font-family:var(--fb);-webkit-font-smoothing:antialiased}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;position:relative;overflow:hidden}
/* HEADER */
.hdr{flex-shrink:0;background:var(--bg2);border-bottom:1.5px solid var(--gd);display:flex;align-items:center;padding:10px 14px;gap:10px;min-height:52px;z-index:10}
.logo{display:flex;align-items:center;gap:8px}
.lmark{width:30px;height:30px;border:1.5px solid var(--g);border-radius:5px;background:var(--gdk);display:flex;align-items:center;justify-content:center;font-family:var(--fn);font-size:13px;font-weight:800;color:var(--g2);flex-shrink:0}
.ltxt{font-family:var(--fn);font-size:17px;font-weight:800;letter-spacing:.1em;color:var(--g2)}
.ltxt em{color:var(--t2);font-style:normal;font-weight:500}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:8px}
/* MAIN + BOTTOM NAV */
.main{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.view{animation:fi .15s ease}
@keyframes fi{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
@keyframes splLogoIn{from{transform:scale(0.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes splHeartbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes splTrackIn{from{letter-spacing:0px;opacity:0}to{letter-spacing:6px;opacity:1}}
@keyframes splSubIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes splLineGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes splDotsIn{from{opacity:0}to{opacity:1}}
@keyframes splWave{0%,60%,100%{background:rgba(201,168,76,.15);transform:scale(.7)}30%{background:#c9a84c;transform:scale(1.35)}}
@keyframes splBorder{to{stroke-dashoffset:0}}
@keyframes doneTrace{to{stroke-dashoffset:0}}
#splash{position:fixed;inset:0;z-index:9999;background:radial-gradient(ellipse at 50% 38%,#0f2238 0%,#0c1828 68%);display:flex;align-items:center;justify-content:center;cursor:pointer;will-change:opacity,transform}
#splash.spl-exit{transition:opacity .55s ease,transform .55s cubic-bezier(.4,0,.2,1);opacity:0;transform:scale(1.07)}
.bnav{flex-shrink:0;background:var(--bg2);border-top:1.5px solid var(--b2);display:flex;padding-bottom:var(--sab)}
.bni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:7px 2px;cursor:pointer;color:var(--t2);min-height:52px;user-select:none;transition:color .15s}
.bni.on{color:var(--g2)}.bni i{font-size:20px;line-height:1}.bni-ico{width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.bni span{font-family:var(--fn);font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
/* TIMER BAR */
.tbar{flex-shrink:0;background:var(--bg2);border-top:2px solid var(--g);display:none;align-items:center;gap:10px;padding:8px 14px 10px}
.tbar.vis{display:flex}
.tbar-info{flex:1;min-width:0}
.tbar-lbl{font-family:var(--fn);font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--t2);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar-prog{height:5px;background:var(--bg5);border-radius:3px;overflow:hidden}
.tbar-fill{height:100%;background:linear-gradient(90deg,var(--gd),var(--g2));border-radius:3px;width:0%;transition:width .2s linear}
.tbar-fill.done{background:var(--green)!important;width:100%!important}
.tbar-num{font-family:var(--fn);font-size:36px;font-weight:800;line-height:1;min-width:70px;text-align:center;flex-shrink:0;color:var(--g2)}
.tbar-num.urgent{color:var(--red)}.tbar-num.done{color:#6dcc8a;font-size:22px}
.tbar-acts{display:flex;gap:5px;flex-shrink:0}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 16px;border-radius:6px;border:1px solid var(--b2);background:var(--bg3);color:var(--t);font-family:var(--fn);font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;user-select:none}
.btn:active{background:var(--bg5)}
.btnp{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 18px;border-radius:6px;border:1.5px solid var(--g);background:var(--gdk);color:var(--g2);font-family:var(--fn);font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;user-select:none}
.btnp:active{background:var(--gd)}
.btnd{border-color:#3a1818;color:#c87060;background:transparent}
.btns{height:36px;padding:0 12px;font-size:13px;border-radius:5px}
.btnxs{height:32px;width:32px;padding:0;font-size:12px;border-radius:4px}
.btnon{background:var(--gdk);border-color:var(--g);color:var(--g2)}
.tba{height:34px;padding:0 10px;border-radius:5px;border:1px solid var(--b2);background:var(--bg3);color:var(--t2);font-family:var(--fn);font-size:12px;font-weight:700;cursor:pointer}
.tba:active{background:var(--bg5)}.tba.on{background:var(--gdk);border-color:var(--g);color:var(--g2)}.tba.xbtn{border-color:#3a1818;color:#c87060}
/* OVERLAYS */
.swov{position:absolute;inset:0;background:rgba(0,0,0,.75);z-index:300;display:flex;flex-direction:column;justify-content:flex-end}
.swsh{background:var(--bg2);border-top:2px solid var(--gd);border-radius:14px 14px 0 0;padding:14px;max-height:75vh;overflow-y:auto;animation:suA .22s ease}
@keyframes suA{from{transform:translateY(60%);opacity:0}to{transform:translateY(0);opacity:1}}
.sw-hdl{width:36px;height:4px;background:var(--b2);border-radius:2px;margin:0 auto 14px}
.sw-row{display:flex;align-items:center;gap:10px;padding:12px;background:var(--bg3);border:1px solid var(--b);border-radius:6px;margin-bottom:6px;cursor:pointer}
.ss-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:4px}
.ss-col-hdr{font-family:var(--fn);font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 0 5px;border-bottom:1.5px solid}
.ss-a{color:var(--g2)}.ss-b{color:var(--gd)}
.sw-name{flex:1;font-family:var(--fn);font-size:15px;font-weight:700}
/* INPUTS */
input,select,textarea{background:var(--bg3);border:1px solid var(--b);color:var(--t);font-family:var(--fb);font-size:16px;border-radius:6px;padding:10px 12px;outline:none;-webkit-appearance:none;appearance:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--g)}
input::placeholder,textarea::placeholder{color:var(--t2)}
select option{background:var(--bg3)}
.ins{padding:8px 10px;font-size:15px;border-radius:5px}
textarea{resize:vertical;min-height:60px;font-size:14px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--g);flex-shrink:0;-webkit-appearance:checkbox;appearance:checkbox;border:none;padding:0}
input[type=date]{color-scheme:dark}
.tgg{display:flex;background:var(--bg3);border:1px solid var(--b);border-radius:6px;overflow:hidden}
.tgo{flex:1;padding:9px;cursor:pointer;font-family:var(--fn);font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--t2);border:none;background:none;min-height:42px;user-select:none;text-align:center}
.tgo.on{background:var(--gdk);color:var(--g2)}.tgo:active{background:var(--bg5)}
/* BADGES */
.bdg{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:11px;font-family:var(--fn);font-weight:700;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.bpush{background:#1a2c1a;color:#78d878;border:1px solid #2a4a2a}
.bfunc{background:#201c10;color:#d4a84c;border:1px solid #4a3a14}
.bnek{background:#101e28;color:#60a8d8;border:1px solid #204060}
.bcore{background:#1a0e28;color:#c080e0;border:1px solid #5a2870}
.blegs{background:#1e0e08;color:#e07838;border:1px solid #5a2810}
.bbackbi{background:#1a1428;color:#a890e0;border:1px solid #4a3878}
.bchesttri{background:#281410;color:#e09060;border:1px solid #7a3818}
.bdelts{background:#28200a;color:#e0c860;border:1px solid #7a6010}
.baccgrip{background:#0a1e1a;color:#60d8c0;border:1px solid #1a6050}
.slot-tag.legs{background:#1e0e08;color:#e07838;border-color:#5a2810}
.slot-tag.neck{background:#101e28;color:#60a8d8;border-color:#204060}
.setc.failed{border-color:#c04040 !important;background:rgba(160,40,40,.08)}
.fail-btn{height:40px;padding:0 10px;flex-shrink:0;border-radius:5px;border:1px solid #804040;background:rgba(160,40,40,.12);color:#d06060;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-family:var(--fn);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.fail-btn.on{background:rgba(180,40,40,.35);border-color:#d04040;color:#e06060}
.bpull{background:#1a1c30;color:#6888e8;border:1px solid #2a2c50}
.bsquat{background:#28182c;color:#b870e0;border:1px solid #402050}
.bgrip{background:#2c2010;color:#e8a030;border:1px solid #503010}
.bacc{background:#1a2430;color:#60b0d8;border:1px solid #204050}
.bme{background:#2c1010;color:#e06060;border:1px solid #501a1a}
.bde{background:#0e2c1a;color:#60e890;border:1px solid #1a5030}
.bant{background:#0e2830;color:#50d8e8;border:1px solid #1a4858}
.bpost{background:#28102c;color:#d060e0;border:1px solid #481858}
.bruck{background:var(--gdk);color:var(--g2);border:1px solid var(--gd)}
/* PILL NAV */
.pnav{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.pnav::-webkit-scrollbar{display:none}
.pill{padding:8px 14px;border-radius:20px;border:1px solid var(--b);background:var(--bg3);color:var(--t2);font-family:var(--fn);font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;white-space:nowrap;user-select:none;min-height:38px;display:inline-flex;align-items:center;gap:5px}
.pill.on{background:var(--gdk);border-color:var(--g);color:var(--g2)}
.pill.dl{background:rgba(74,56,16,.3)!important;border-color:var(--gd)!important;color:var(--g)!important}
.pill.dl.on{background:var(--gdk)!important;border-color:var(--g)!important;color:var(--g2)!important}
/* SWIPE NAV */
.swipe-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.swp-btn{display:flex;align-items:center;gap:4px;padding:8px 10px;min-height:40px;border-radius:6px;cursor:pointer;font-family:var(--fn);font-size:12px;font-weight:700;color:var(--t2);letter-spacing:.05em;text-transform:uppercase;user-select:none;min-width:72px}
.swp-btn.l{justify-content:flex-start}.swp-btn.r{justify-content:flex-end}
.swp-btn:active{background:var(--bg3)}
.swp-cur{font-family:var(--fn);font-size:13px;font-weight:700;color:var(--g2);letter-spacing:.06em;text-transform:uppercase}
/* CARDS */
.card{background:var(--bg2);border:1px solid var(--b);border-radius:8px;padding:14px;margin-bottom:12px}
.card-i{background:var(--bg3);border:1px solid var(--b);border-radius:6px;padding:12px;margin-bottom:8px}
.gcrd{background:var(--bg2);border:1.5px solid var(--gd);border-radius:8px;padding:14px;margin-bottom:12px}
/* EXERCISE BLOCKS */
.exb{background:var(--bg2);border:1px solid var(--b);border-radius:8px;margin-bottom:14px;overflow:hidden}
.exb.me{border-color:var(--gd)}
.exbh{padding:12px;background:var(--bg3);border-bottom:1px solid var(--b)}
.exb.me .exbh{background:var(--bg4);border-bottom-color:var(--gd)}
.exbn{font-family:var(--fn);font-size:18px;font-weight:800;letter-spacing:.03em}
.exbr{font-family:var(--fn);font-size:10px;font-weight:700;letter-spacing:.09em;color:var(--t2);text-transform:uppercase}
.exby{padding:12px;max-height:3000px;overflow:hidden;transition:max-height .38s cubic-bezier(.4,0,.2,1),padding .38s ease}
.exby-collapsed{max-height:0!important;padding-top:0!important;padding-bottom:0!important}
.collapse-btn{background:none;border:none;cursor:pointer;color:var(--t2);font-size:21px;padding:2px 4px;line-height:1;flex-shrink:0;align-self:flex-start}
/* SET CARDS */
.setc{background:var(--bg3);border:1px solid var(--b);border-radius:7px;padding:10px;margin-bottom:8px}
.setc.topset{border:1.5px solid var(--g);background:rgba(74,56,16,.3);border-left:4px solid var(--g2)}
.setc.attempt{opacity:.7;border-color:var(--b2)}
.sr1{display:grid;grid-template-columns:22px 1fr 1fr 1fr 32px;gap:6px;align-items:end;margin-bottom:8px}
.sr2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.wu-row{display:grid;grid-template-columns:22px 1fr 1fr 36px 32px;gap:6px;align-items:end;margin-bottom:8px}
.wu-row-bo{display:grid;grid-template-columns:22px 1fr 1fr 1fr 36px 32px;gap:6px;align-items:end;margin-bottom:8px}
.snum{font-family:var(--fn);font-size:14px;font-weight:800;color:var(--gd);text-align:center;padding-bottom:8px}
.sf{display:flex;flex-direction:column}
.sf input,.sf select{min-height:40px}
.sf label{font-family:var(--fn);font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--t2);text-transform:uppercase;margin-bottom:3px}
.sf input{text-align:center;padding:8px 4px;font-size:16px}
.star-btn{height:36px;width:36px;padding:0;border-radius:5px;border:1.5px solid var(--b2);background:var(--bg5);color:var(--t2);font-size:20px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.star-btn:active{background:var(--bg4)}.star-btn.on{background:var(--gdk);border-color:var(--g);color:var(--g2)}
.wu-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;font-size:11px;font-family:var(--fn);font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--gdk);color:var(--g2);border:1px solid var(--gd)}
.pr-btn{height:36px;width:36px;flex-shrink:0;border-radius:5px;border:1px solid var(--gd);background:rgba(74,56,16,.2);color:var(--g2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:18px;padding:0}
.pr-btn:active{background:var(--gdk)}
/* REST BUTTON */
.rest-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:40px;border-radius:5px;border:1px solid var(--gd);background:rgba(74,56,16,.3);color:var(--g);font-family:var(--fn);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;margin-top:8px}
.rest-btn:active{background:var(--gdk)}
/* TARGETS */
.tgt{display:flex;align-items:center;gap:10px;padding:10px 12px;background:linear-gradient(135deg,rgba(74,56,16,.5),rgba(122,94,32,.2));border:1px solid var(--gd);border-radius:7px;margin-bottom:10px}
.tgt.dl{background:linear-gradient(135deg,rgba(20,14,4,.5),rgba(50,38,12,.3));border-color:var(--b2)}
.tgt-icon{color:var(--g2);font-size:18px;flex-shrink:0}
.tgt-body{flex:1;min-width:0}
.tgt-t{font-family:var(--fn);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t2);margin-bottom:2px}
.tgt-v{font-family:var(--fn);font-size:18px;font-weight:800;color:var(--g2)}
.tgt-p{font-family:var(--fn);font-size:11px;color:var(--t2);margin-top:2px}
.tgt-app{height:36px;padding:0 12px;border-radius:5px;border:1.5px solid var(--g);background:var(--gdk);color:var(--g2);font-family:var(--fn);font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0}
.tgt-app.dl{border-color:var(--b2);background:var(--bg4);color:var(--t2)}
/* DELOAD */
.deload-bar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(122,94,32,.15);border:1px solid var(--gd);border-radius:6px;margin-bottom:12px;font-family:var(--fn);font-size:13px;color:var(--g);letter-spacing:.04em;font-weight:700;text-transform:uppercase}
/* 1RM BADGE */
.orm-bdg{font-family:var(--fn);font-size:12px;font-weight:700;color:var(--g);background:rgba(122,94,32,.2);border:1px solid var(--gdk);padding:2px 8px;border-radius:10px;white-space:nowrap}
/* SWAP BTN */
.sw-btn{height:28px;min-width:36px;padding:0 10px;border-radius:4px;border:1px solid var(--b2);background:var(--bg4);color:var(--t2);font-family:var(--fn);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.move-col{display:flex;flex-direction:column;gap:2px;margin-right:10px;flex-shrink:0}
.move-btn{width:24px;height:18px;font-size:10px;line-height:1;padding:0;border-radius:3px;border:1px solid var(--b2);background:var(--bg4);color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center}
.move-btn:active{background:var(--bg5)}
.sw-btn:active{background:var(--bg5)}.sw-btn.on{border-color:var(--g);color:var(--g2);background:var(--gdk)}
/* CATEGORY SELECTOR */
.cat-sec{background:var(--bg3);border:1px solid var(--b);border-radius:8px;margin-bottom:10px;overflow:hidden}
.cat-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;cursor:pointer;user-select:none;background:var(--bg4)}
.cat-hdr:active{background:var(--bg5)}
.cat-hdr-l{display:flex;align-items:center;gap:8px}
.cat-name{font-family:var(--fn);font-size:13px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--t2)}
.cat-cnt{font-family:var(--fn);font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;letter-spacing:.04em}
.cat-cnt.ok{background:#0e2c1a;color:#60e890;border:1px solid #1a5030}
.cat-cnt.warn{background:#2c2010;color:#e8a030;border:1px solid #503010}
.cat-cnt.bad{background:#2c1010;color:#e06060;border:1px solid #501a1a}

<body>
<div id="app"></div>
<script>
// ─── STATE ────────────────────────────────────────────────────────────────────
const SK='ss_v9';
let TM={on:false,end:0,dur:0,lbl:'',iv:null};
let SX=0,SY=0,editExId=null;
let CO={me:false,push:false,func:false,back_bi:false,chest_tri:false,delts:false,legs:false,neck:false,grip:false,core:false};
let showCompare=false;

function load(){
  for(const k of['ss_v9','ss_v8','ss_v7','ss_v6','simplystrong_v1','rucklift_v2']){
    try{const r=localStorage.getItem(k);if(r)return{...def(),...JSON.parse(r)};}catch(e){}
  }
  return def();
}
function save(){try{localStorage.setItem(SK,JSON.stringify(S));}catch(e){}}
function def(){return{
  tab:'lib',trainDays:3,hasRuck:true,cw:4,
  lib:[],cycles:[],cid:null,wk:0,dy:0,
  prs:[],sel:[],stEx:null,stTab:'over',
  name:'',bw:'',unit:'kg',defRest:60,libSearch:'',
  deloadWeeks:{},homeGymDays:[],ruckUnit:'mi'
};}
let S=load();
// ─── AUTO-MIGRATIONS (run once on load) ───────────────────────────────────────
(function migrateLegacy(){
  let d=false;
  const rn=(from,to)=>{const e=(S.lib||[]).find(x=>x.name===from);if(!e)return;e.name=to;(S.cycles||[]).forEach(c=>(c.sessions||[]).forEach(s=>(s.exercises||[]).forEach(x=>{if(x.libId===e.id)x.name=to;})));(S.prs||[]).forEach(p=>{if(p.exercise===from)p.exercise=to;});d=true;};
  rn('Squat','Bare Knee Squat');
  // Ensure Bare Knee Squat is Dynamic
  const bkq=(S.lib||[]).find(e=>e.name==='Bare Knee Squat');
  if(bkq&&bkq.focus!=='Dynamic'){bkq.focus='Dynamic';d=true;}
  rn('French Press','Prone Single DB French Press');
  rn('Standing DB Extension','Standing DB Tri Extension');
  if(!S.ruckUnit){S.ruckUnit='mi';d=true;}
  rn('Fingertip Shrug DL Bar','Fingertip Shrug Barbell');
  rn('Rear DB','Rear DB Fly');
  // Move Seal Axel Holds to Grip
  const seal=(S.lib||[]).find(e=>e.name==='Seal Axel Holds');
  if(seal&&seal.skill!=='Grip'){seal.skill='Grip';seal.category='';d=true;}
  // Delete Trap Bar Walk High Handle
  const beforeTBWH=S.lib.length;
  S.lib=(S.lib||[]).filter(e=>e.name!=='Trap Bar Walk High Handle');
  if(S.lib.length!==beforeTBWH)d=true;
  rn('Tricep Cable Kickback','Tricep Cable Uni');
  // Move Suitcase Shrug to Grip skill
  const ss=(S.lib||[]).find(e=>e.name==='Suitcase Shrug');
  if(ss&&ss.skill!=='Grip'){ss.skill='Grip';ss.category='';d=true;}
  // Move Hanging Leg Raise to core category
  const hlr=(S.lib||[]).find(e=>e.name==='Hanging Leg Raise');
  if(hlr&&hlr.category!=='core'){hlr.category='core';d=true;}
  // Delete exercises removed from the plan
  ['Chain Yoke Walk','Nordic Curl','Paloff Press','Ab Wheel'].forEach(nm=>{
    const before=(S.lib||[]).length;
    S.lib=(S.lib||[]).filter(e=>e.name!==nm);
    if(S.lib.length!==before)d=true;
  });
  // Move leg accessories to 'legs' subcategory
  const legNames=new Set(['Ham Curl Prone','Stiff Leg DB','Hip Thrusts','GHR','Leg Extension']);
  (S.lib||[]).forEach(e=>{if(e.skill==='Accessories'&&legNames.has(e.name)&&e.category!=='legs'){e.category='legs';d=true;}});
  // All grip accessories should be Dynamic
  (S.lib||[]).forEach(e=>{if(e.skill==='Grip'&&e.focus==='Max Effort'){e.focus='Dynamic';d=true;}});
  // ── 7-category Accessories restructure ──────────────────────────────────────
  // Merge the old Grip skill into Accessories with category 'grip'
  (S.lib||[]).forEach(e=>{if(e.skill==='Grip'){e.skill='Accessories';e.category='grip';d=true;}});
  // Remap old anterior/posterior categories to back_bi / chest_tri / delts / grip / core
  const TO_DELTS=new Set(['Rear DB Fly','Reverse Fly Machine','Lateral Raise DB','Front Raise EZ']);
  const TO_GRIP_FROM_ACC=new Set(['Forearm Rev Curl']);
  (S.lib||[]).forEach(e=>{
    if(e.skill!=='Accessories')return;
    if(e.category==='anterior'||e.category==='posterior'){
      if(TO_GRIP_FROM_ACC.has(e.name))e.category='grip';
      else if(TO_DELTS.has(e.name))e.category='delts';
      else if(e.category==='anterior')e.category='chest_tri';
      else e.category='back_bi';
      d=true;
    }
  });
  // Add rotation fields to existing cycles that predate this feature
  (S.cycles||[]).forEach(c=>{
    if(!c.rotationId){c.rotationId=c.id;d=true;}
    if(!c.cycleNumber){c.cycleNumber=1;d=true;}
    if(!c.manualAdditions){c.manualAdditions=[];d=true;}
    if(!c.supersetPairs){c.supersetPairs=[];d=true;}
  });
  // Default ME main exercises to WU mode
  (S.cycles||[]).forEach(c=>(c.sessions||[]).forEach(sess=>(sess.exercises||[]).forEach(ex=>{
    // (WU mode removed — no longer auto-enabled for ME exercises)
  })));
  const hasSetData=s=>s.weight||s.reps||s.rpe||s.notes||s.failed;
  (S.cycles||[]).forEach(c=>(c.sessions||[]).forEach(sess=>(sess.exercises||[]).forEach(ex=>{
    if(!ex.sets||ex.sets.length<=1)return;
    while(ex.sets.length>1&&!hasSetData(ex.sets[ex.sets.length-1])){ex.sets.pop();d=true;}
  })));
  // Resync historical session exercises' skill/category snapshots to current library
  // (fixes stale "anterior"/"posterior"/blank-Grip badges on sessions logged before the 7-category restructure)
  (S.cycles||[]).forEach(c=>(c.sessions||[]).forEach(sess=>(sess.exercises||[]).forEach(ex=>{
    const lib=S.lib.find(l=>l.id===ex.libId);
    if(lib&&(ex.skill!==lib.skill||ex.category!==(lib.category||''))){
      ex.skill=lib.skill;ex.category=lib.category||'';d=true;
    }
  })));
  if(d)save();
})();

// ─── UTILITIES ────────────────────────────────────────────────────────────────
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function notify(m){
  document.querySelectorAll('.notif').forEach(n=>n.remove());
  const e=document.createElement('div');e.className='notif';e.textContent=m;
  document.querySelector('.app')?.appendChild(e);
  setTimeout(()=>e.remove(),2600);
}
function uw(){return S.unit||'kg';}
function fmtS(s){return Math.floor(s/60)+':'+(s%60<10?'0':'')+s%60;}
function metricLbl(m){return m==='metres'?'Metres':m==='seconds'?'Secs':m==='minutes'?'Mins':'Reps';}
function metricBadge(m){if(!m||m==='reps')return'';return`<span class="bdg" style="background:var(--bg4);border:1px solid var(--b2);color:var(--t2);font-size:10px">${m==='metres'?'m':m==='seconds'?'s':m==='minutes'?'min':m}</span>`;}
function sb(sk){const m={Push:'bpush',Pull:'bpull',Squat:'bsquat',Accessories:'bacc',Functional:'bfunc'};return`<span class="bdg ${m[sk]||'bacc'}">${sk}</span>`;}
function cb(cat){
  const map={back_bi:['Back & Bi','bbackbi'],chest_tri:['Chest & Tri','bchesttri'],delts:['Delts','bdelts'],legs:['Legs','blegs'],neck:['Neck','bnek'],grip:['Grip','baccgrip'],core:['Core','bcore']};
  if(!cat)return'';
  const e=map[cat];
  return e?`<span class="bdg ${e[1]}">${e[0]}</span>`:`<span class="bdg bacc" style="opacity:.7">${cat}</span>`;
}
function fb(fo){return`<span class="bdg ${fo==='Max Effort'?'bme':'bde'}">${fo==='Max Effort'?'ME':'DE'}</span>`;}
function mkSet(){return{id:uid(),weight:'',reps:'',sets:'',rpe:'',rest:'',equipment:'',notes:'',failed:false};}

const MAIN_SKILLS=new Set(['Squat','Pull','Push','Functional']);
function rawKg(val,ex){
  const v=parseFloat(val)||0;
  if((ex?.weightMode||'kg')==='pps')return v*40; // plates per side × 2 sides × 20kg
  return v;
}
function exVol(ex){
  return(ex.sets||[]).reduce((t,s)=>{
    const kg=rawKg(s.weight,ex);
    const r=parseInt(s.reps)||0,n=Math.max(1,parseInt(s.sets)||1);
    return t+kg*r*n;
  },0);
}
function vol(sets){return(sets||[]).reduce((t,s)=>{const w=parseFloat(s.weight)||0,r=parseInt(s.reps)||0,n=Math.max(1,parseInt(s.sets)||1);return t+w*r*n;},0);}
function epley(w,r){if(!w||!r||r<1)return 0;if(r===1)return w;if(r>=37)return 0;return Math.round(w*(36/(37-r))*10)/10;}
function vsf(v){return v>999?(v/1000).toFixed(1)+'k':Math.round(v)||'0';}
function vTonnes(v){const t=v/1000;return(t>=10?t.toFixed(1):t.toFixed(2))+'t';}

// ─── 1RM CALCULATIONS ─────────────────────────────────────────────────────────
function getBest1RM(libId){
  let best=0;
  S.cycles.forEach(c=>c.sessions.forEach(s=>(s.exercises||[]).filter(e=>e.libId===libId&&(!e.metric||e.metric==='reps')).forEach(e=>{
    effSets(e).forEach(st=>{
      const r=parseInt(st.reps);
      if(r<2||r>5)return; // Brzycki valid range: 2–5 reps only
      const v=epley(parseFloat(st.weight),r);
      if(v>best)best=v;
    });
  })));
  return best>0?best:null;
}
function effSets(ex){
  return ex.sets||[];
}
function allOrms(){
  const map={};
  S.cycles.forEach(c=>c.sessions.forEach(s=>(s.exercises||[]).forEach(e=>{
    if(e.metric&&e.metric!=='reps')return;
    if(!map[e.name])map[e.name]={best:0,w:0,r:0};
    effSets(e).forEach(st=>{
      const r=parseInt(st.reps);
      if(r<2||r>5)return; // Brzycki valid range
      const v=epley(parseFloat(st.weight),r);
      if(v>map[e.name].best){map[e.name].best=v;map[e.name].w=parseFloat(st.weight)||0;map[e.name].r=r;}
    });
  })));
  return Object.entries(map).filter(([,v])=>v.best>0).map(([n,v])=>({name:n,orm:v.best,w:v.w,r:v.r})).sort((a,b)=>b.orm-a.orm);
}

// ─── DELOAD ───────────────────────────────────────────────────────────────────
function isDeload(cycId,wk){return((S.deloadWeeks||{})[cycId]||[]).includes(wk);}
function toggleDeload(cycId,wk){
  if(!S.deloadWeeks)S.deloadWeeks={};
  if(!S.deloadWeeks[cycId])S.deloadWeeks[cycId]=[];
  const arr=S.deloadWeeks[cycId],idx=arr.indexOf(wk);
  if(idx>-1)arr.splice(idx,1);else arr.push(wk);
  save();rv();
}

// ─── TIMER ────────────────────────────────────────────────────────────────────
function parseRest(s){
  if(!s)return S.defRest||120;
  const str=String(s).trim();
  if(str.includes(':')){const p=str.split(':');return(parseInt(p[0])||0)*60+(parseInt(p[1])||0);}
  const n=parseFloat(str)||0;
  if(str.endsWith('m'))return Math.round(n*60);
  if(n>0&&n<=30)return Math.round(n*60);
  return n||S.defRest||120;
}
function startTimer(secs,lbl){
  if(TM.iv)clearInterval(TM.iv);
  TM={on:true,end:Date.now()+secs*1000,dur:secs,lbl,iv:null,warned:false};
  const tb=document.getElementById('tbar');
  if(tb){tb.classList.add('vis');const tl=document.getElementById('tl');if(tl)tl.textContent=lbl||'Rest Timer';}
  TM.iv=setInterval(tickTM,200);tickTM();
}
function tickTM(){
  const rem=Math.max(0,TM.end-Date.now());
  const td=document.getElementById('td'),tf=document.getElementById('tf');
  if(!td)return;
  if(rem>0){
    const m=Math.floor(rem/60000),sc=Math.floor((rem%60000)/1000);
    td.textContent=m+':'+(sc<10?'0':'')+sc;
    td.className='tbar-num'+(rem<11000?' urgent':'');
    if(tf){tf.className='tbar-fill';tf.style.width=((1-(rem/(TM.dur*1000)))*100)+'%';}
    // 10-second warning — single beep + short vibrate
    if(rem<=10500&&!TM.warned){
      TM.warned=true;
      if(navigator.vibrate)navigator.vibrate([120]);
      try{
        const ac=new(window.AudioContext||window.webkitAudioContext)();
        const o=ac.createOscillator(),g=ac.createGain();
        o.connect(g);g.connect(ac.destination);
        o.frequency.value=880;o.type='triangle';
        g.gain.setValueAtTime(0.5,ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.15);
        o.start(ac.currentTime);o.stop(ac.currentTime+0.18);
      }catch(e){}
    }
  }else{
    clearInterval(TM.iv);TM.on=false;
    td.textContent='GO!';td.className='tbar-num done';
    if(tf)tf.className='tbar-fill done';
    if(navigator.vibrate)navigator.vibrate([500,120,500,120,600,120,900]);
    // Audio alarm — three ascending beeps
    try{
      const ac=new(window.AudioContext||window.webkitAudioContext)();
      function beepTone(freq,t,dur,vol=0.9){const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=freq;o.type='triangle';g.gain.setValueAtTime(vol,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+t+dur);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+dur+0.05);}
      beepTone(660,0,0.25);beepTone(770,0.32,0.25);beepTone(990,0.65,0.3);beepTone(1100,1.0,0.55);
    }catch(e){}
    setTimeout(()=>{const tb=document.getElementById('tbar');if(tb)tb.classList.remove('vis');},4500);
  }
}
function extT(s){if(TM.on||TM.end>Date.now()){TM.end+=s*1000;TM.dur+=s;}}
function stopT(){if(TM.iv)clearInterval(TM.iv);TM.on=false;const tb=document.getElementById('tbar');if(tb)tb.classList.remove('vis');}

// ─── PROGRESSIVE TARGET ───────────────────────────────────────────────────────
function rpeJump(kg,reps,rpe){
  // Returns {kg, reps, note} based on previous RPE
  if(!rpe||rpe<=0)return{kg:kg+2.5,reps,note:'no RPE logged → +2.5kg'};
  const r=parseFloat(rpe);
  if(r<=6.5)return{kg:kg+7.5,reps,note:`RPE ${r} → +7.5kg (lots of room)`};
  if(r<=7.5)return{kg:kg+5,reps,note:`RPE ${r} → +5kg (good room)`};
  if(r<=8.5)return{kg:kg+2.5,reps,note:`RPE ${r} → +2.5kg (on track)`};
  if(r<=9)return{kg,reps:reps+1,note:`RPE ${r} → hold, +1 rep (near max)`};
  if(r<=9.5)return{kg,reps,note:`RPE ${r} → hold weight (at max)`};
  return{kg:kg-2.5,reps:reps+1,note:`RPE ${r} → back off -2.5kg (over max)`};
}
function getTgt(libId,cid,week,day){
  const cyc=S.cycles.find(c=>c.id===cid);if(!cyc)return null;
  const siblings=siblingCycles(cid);
  const cidxSib=siblings.findIndex(c=>c.id===cid);
  // Detect exercise weightMode from current session
  const sessEx=cyc.sessions.find(s=>s.week===week&&s.day===day)?.exercises.find(e=>e.libId===libId);
  const isPPS=(sessEx?.weightMode||'kg')==='pps';
  let hist=[];
  function extract(ex,sess,cycId){
    if(sess.missed)return;
    if(isDeload(cycId,sess.week))return;
    const exIsPPS=(ex.weightMode||'kg')==='pps';
    effSets(ex).filter(st=>parseFloat(st.weight)>0&&!st.failed).forEach(st=>{
      const kg=exIsPPS?parseFloat(st.weight)*40:parseFloat(st.weight);
      hist.push({kg,reps:parseInt(st.reps)||0,rpe:parseFloat(st.rpe)||0,sets:st.sets||'',equipment:st.equipment||'',notes:st.notes||''});
    });
  }
  cyc.sessions.forEach(s=>{if(s.week===week&&s.day===day)return;(s.exercises||[]).filter(e=>e.libId===libId).forEach(ex=>extract(ex,s,cid));});
  if(cidxSib>0)siblings.slice(0,cidxSib).reverse().forEach(pc=>pc.sessions.forEach(s=>(s.exercises||[]).filter(e=>e.libId===libId).forEach(ex=>extract(ex,s,pc.id))));
  if(!hist.length)return null;
  const best=hist.reduce((a,b)=>b.kg>a.kg?b:a,{kg:0,reps:0,rpe:0,sets:'',equipment:'',notes:''});
  if(!best.kg)return null;
  // Convert result back to display unit
  function toDisplay(kg){return isPPS?Math.round(kg/40*4)/4:Math.round(kg/2.5)*2.5;}
  const suffix=isPPS?' PPS':'';
  if(isDeload(cid,week)){
    const dlKg=best.kg*0.85;
    return{kg:toDisplay(dlKg),reps:best.reps+2,pKg:toDisplay(best.kg),pReps:best.reps,pRpe:best.rpe,pSets:best.sets,pEquipment:best.equipment,pNotes:best.notes,note:'deload 85%',isDeload:true,suffix};
  }
  const adj=rpeJump(best.kg,best.reps,best.rpe);
  return{kg:toDisplay(adj.kg),reps:adj.reps,pKg:toDisplay(best.kg),pReps:best.reps,pRpe:best.rpe,pSets:best.sets,pEquipment:best.equipment,pNotes:best.notes,note:adj.note,isDeload:false,suffix};
}
function applyTgt(cid,w,d,eid,kg,reps){
  const ex=gEx(cid,w,d,eid);if(!ex)return;
  const s=ex.sets.find(x=>!x.weight)||ex.sets[0];
  if(s){s.weight=String(kg);s.reps=String(reps);}
  save();rv();
}

// ─── SWAP OVERLAY ─────────────────────────────────────────────────────────────
function swapSort(a,b){
  // Group by focus (ME before DE) then subcategory then name
  const focOrd={['Max Effort']:0,Dynamic:1};
  const fo=(focOrd[a.focus]??1)-(focOrd[b.focus]??1);
  if(fo!==0)return fo;
  const catOrd={back_bi:0,chest_tri:1,delts:2,legs:3,neck:4,grip:5,core:6,'':7};
  const co=(catOrd[a.category??'']??7)-(catOrd[b.category??'']??7);
  if(co!==0)return co;
  return a.name.localeCompare(b.name);
}
function openSwap(cid,w,d,exId){
  const cyc=S.cycles.find(c=>c.id===cid);if(!cyc)return;
  const sess=cyc.sessions.find(s=>s.week===w&&s.day===d);if(!sess)return;
  const ex=sess.exercises.find(e=>e.id===exId);if(!ex)return;
  const isHG=sess.isHomeGym;
  const opts=[...S.lib.filter(l=>l.skill===ex.skill&&(!isHG||l.homeGym))].sort(swapSort);
  let curGroup='';
  const rows=opts.length
    ?opts.map(l=>{
        const groupKey=(l.focus||'')+'|'+(l.category||'');
        const divider=groupKey!==curGroup?(curGroup=groupKey,l.category
          ?`<div class="lbl" style="padding:6px 12px 2px;margin-top:4px;color:var(--t2);font-size:10px">${cb(l.category)||fb(l.focus)}</div>`
          :`<div class="lbl" style="padding:6px 12px 2px;margin-top:4px;color:var(--t2);font-size:10px">${fb(l.focus)}</div>`):'';
        return`${divider}<div class="sw-row ${l.id===ex.libId?'cur':''}" onclick="doSwap('${cid}',${w},${d},'${exId}','${l.id}')"><div class="sw-name">${l.name}${l.homeGym?`<span style="color:#6dcc8a;margin-left:6px;font-size:11px">⌂</span>`:''}</div></div>`;
      }).join('')
    :`<div class="chart-empty">No ${isHG?'home gym ':''}${ex.skill} exercises available${isHG?' — mark exercises ⌂ in Library':''}</div>`;
  document.querySelector('.app').insertAdjacentHTML('beforeend',
    `<div class="swov" id="swov" onclick="closeOverlay('swov',event)">
      <div class="swsh" onclick="event.stopPropagation()">
        <div class="sw-hdl"></div>
        <div class="fbet mb12">
          <div><div class="lbl">Swap${isHG?' · Home Gym Only':''} — ${ex.skill}</div><div style="font-family:var(--fn);font-size:14px;color:var(--t2)">${ex.name}</div></div>
          <button class="tba xbtn" onclick="closeOverlay('swov')">✕</button>
        </div>${rows}
      </div>
    </div>`);
}
function doSwap(cid,w,d,exId,nid){
  const cyc=S.cycles.find(c=>c.id===cid);if(!cyc)return;
  const ex=gEx(cid,w,d,exId);const nl=S.lib.find(l=>l.id===nid);
  if(!ex||!nl)return;
  // Apply to current session
  ex.libId=nl.id;ex.name=nl.name;ex.skill=nl.skill;ex.focus=nl.focus;ex.category=nl.category||'';ex.metric=nl.metric||'reps';
  // Regenerate all future sessions with offset for variety
  const cutIdx=cyc.sessions.findIndex(s=>s.week>w||(s.week===w&&s.day>d));
  if(cutIdx>-1){
    const kept=cyc.sessions.slice(0,cutIdx);
    const newAll=genCycle(cyc.selIds,cyc.weeks,cutIdx);
    cyc.sessions=[...kept,...newAll.filter(s=>s.week>w||(s.week===w&&s.day>d))];
  }
  save();closeOverlay('swov');rv();notify('Swapped → '+nl.name+' — plan updated');
}

function detectPR(name,weight,reps,notes=''){
  const kg=parseFloat(weight),r=parseInt(reps);if(!kg||!r)return;
  const best=S.prs.filter(p=>p.exercise===name&&parseInt(p.reps)===r)
    .reduce((a,b)=>parseFloat(b.kg)>parseFloat(a.kg)?b:a,{kg:0});

    save();notify('★ PR — '+name+' '+kg+uw()+' × '+r+'r');

// ─── CYCLE GENERATION ─────────────────────────────────────────────────────────
function genCycle(selIds,weeks,rotOff=0){
  const sel=S.lib.filter(e=>selIds.includes(e.id));
  const hgDays=S.homeGymDays||[];
  function pool(arr,dayIdx){return hgDays.includes(dayIdx)?arr.filter(e=>e.homeGym):arr;}
  function hg(arr){const h=arr.filter(e=>e.homeGym);return h.length?h:arr;}
  const squat=sel.filter(e=>e.skill==='Squat');
  const pull=sel.filter(e=>e.skill==='Pull');
  const push=sel.filter(e=>e.skill==='Push');
  const grip=sel.filter(e=>e.skill==='Accessories'&&e.category==='grip');
  const func=sel.filter(e=>e.skill==='Functional');
  const backBi=sel.filter(e=>e.skill==='Accessories'&&e.category==='back_bi');
  const chestTri=sel.filter(e=>e.skill==='Accessories'&&e.category==='chest_tri');
  const delts=sel.filter(e=>e.skill==='Accessories'&&e.category==='delts');
  const acc=sel.filter(e=>e.skill==='Accessories'&&(e.category==='back_bi'||e.category==='chest_tri'||e.category==='delts'||e.category==='core'));
  const legs=sel.filter(e=>e.skill==='Accessories'&&e.category==='legs');
  const nk=sel.filter(e=>e.skill==='Accessories'&&e.category==='neck');
  function rot(arr,n){return arr.length?arr[((n%arr.length)+arr.length)%arr.length]:null;}
  const sessions=[];
  let sqi=rotOff,pui=rotOff,mpi=rotOff,mp2i=rotOff,gi=rotOff,fi=rotOff,ai=rotOff,nki=rotOff,lgi=rotOff,cori=rotOff;
  const td=S.trainDays||3;const hr=S.hasRuck!==false;
  function mkLong(w,dayIdx,mainPool,isSquat){
    const d=[];
    const mainD=pool(mainPool,dayIdx),fnD=pool(func,dayIdx),gD=pool(grip,dayIdx);
    const lgD=pool(legs,dayIdx),acD=pool(acc,dayIdx);
    const used=new Set();
    function add(arr,idx,role,fallback){
      let e=rot(arr,idx);
      if((!e||used.has(e.id))&&fallback){const fb=fallback.filter(x=>!used.has(x.id));e=fb.length?fb[idx%fb.length]:null;}
      if(!e||used.has(e.id))return;d.push({...e,role});used.add(e.id);
    }
    const mainIdx=isSquat?sqi++:pui++;
    add(mainD,mainIdx,'main');
    add(fnD,fi++,'func');
    add(lgD,lgi++,'legs_acc',acD);
    add(acD.filter(e=>!used.has(e.id)),ai++,'acc',lgD);
    add(gD,gi++,'grip');
    d.sort((a,b)=>exSkillOrder(a)-exSkillOrder(b));
    return{week:w,day:dayIdx,type:'long',done:false,notes:'',isHomeGym:hgDays.includes(dayIdx),exercises:d.map(mkEx),ruckData:null};
  }
  function mkShort(w,dayIdx){
    const d=[];
    const mpD=hg(push),gD=hg(grip),nkD=hg(nk),acD=hg(acc),corD=hg(sel.filter(e=>e.skill==='Accessories'&&e.category==='core'));
    const chestTriD=hg(chestTri),backBiD=hg(backBi),deltsD=hg(delts);
    const used=new Set();
    function add(arr,idx,role,fallback){
      let e=rot(arr,idx);
      if((!e||used.has(e.id))&&fallback){const fb=fallback.filter(x=>!used.has(x.id));e=fb.length?fb[idx%fb.length]:null;}
      if(!e||used.has(e.id))return;d.push({...e,role});used.add(e.id);
    }
    add(mpD,mpi++,'main_push');                                       // 1. ME Push
    add(mpD.filter(e=>!used.has(e.id)),mp2i++,'push2');               // 2. Push volume
    add(chestTriD.filter(e=>!used.has(e.id)),ai++,'acc',[...deltsD,...acD]);   // 3. Chest & Tri (anterior)
    add(backBiD.filter(e=>!used.has(e.id)),ai++,'acc2',[...deltsD,...acD]);    // 4. Back & Biceps (posterior)
    add(corD.filter(e=>!used.has(e.id)),cori++,'core_acc',acD);       // 5. Core
    add(nkD,nki++,'neck',acD);                                        // 6. Neck
    add(gD,gi++,'grip');                                              // 7. Grip
    d.sort((a,b)=>exSkillOrder(a)-exSkillOrder(b));
    return{week:w,day:dayIdx,type:'short',done:false,notes:'',isHomeGym:true,exercises:d.map(mkEx),ruckData:null};
  }
  const meCombined=sel.filter(e=>e.skill==='Squat'||e.skill==='Pull');
  for(let w=0;w<weeks;w++){
    if(td===1){
      const d=[];const used=new Set();
      function addF(arr,idx,role,fb){let e=rot(arr,idx);if((!e||used.has(e.id))&&fb){const f=fb.filter(x=>!used.has(x.id));e=f.length?f[idx%f.length]:null;}if(!e||used.has(e.id))return;d.push({...e,role});used.add(e.id);}
      addF(meCombined,sqi++,'main');addF(func,fi++,'func');addF(hg(push),mpi++,'main_push');
      addF(legs,lgi++,'legs_acc',acc);addF(hg(nk),nki++,'neck',hg(acc));
      addF(acc.filter(e=>!used.has(e.id)),ai++,'acc');addF(grip,gi++,'grip');
      d.sort((a,b)=>(SKILL_ORDER[a.skill]??6)-(SKILL_ORDER[b.skill]??6));
      sessions.push({week:w,day:0,type:'full',done:false,notes:'',isHomeGym:false,exercises:d.map(mkEx),ruckData:null});
    } else if(td===2){
      sessions.push(mkLong(w,0,w%2===0?squat:pull,w%2===0));
      sessions.push(mkShort(w,1));
    } else if(td===3){
      sessions.push(mkLong(w,0,squat,true));
      sessions.push(mkShort(w,1));
      sessions.push(mkLong(w,2,pull,false));
    } else {
      sessions.push(mkLong(w,0,squat,true));
      sessions.push(mkShort(w,1));
      sessions.push(mkLong(w,2,pull,false));
      sessions.push(mkShort(w,3));
    }
    if(hr)sessions.push({week:w,day:td,type:'ruck',done:false,notes:'',isHomeGym:false,exercises:[],ruckData:{weight:'',distance:'',duration:'',notes:'',equipment:''}});
  }
  return sessions;
}

function autofill(cyc,prev){
  if(!prev)return;
  cyc.sessions.forEach(s=>{
    const ps=prev.sessions.find(x=>x.week===s.week&&x.day===s.day);if(!ps)return;
    s.exercises.forEach(ex=>{
      const pe=ps.exercises.find(x=>x.libId===ex.libId);
      if(!pe||!pe.sets||!pe.sets.length)return;
      ex.sets=pe.sets.map(st=>({...mkSet(),weight:st.weight||'',reps:st.reps||'',sets:st.sets||'',rest:st.rest||'',equipment:st.equipment||'',
        notes:[st.weight&&st.weight+uw(),st.reps&&'×'+st.reps+'r'].filter(Boolean).join(' ')
          ?'↑ '+[st.weight&&st.weight+uw(),st.reps&&'×'+st.reps+'r'].filter(Boolean).join(' '):''}));
    });
    if(s.type==='ruck'&&ps.ruckData){
      const r=ps.ruckData;
      s.ruckData={...r,notes:[r.distance&&r.distance+ruDist(),r.duration].filter(Boolean).join(' ')};
    }
  });
}

function editEx(id){editExId=id;libDelPending=null;rlLib();}
function saveEx(id){
  const e=S.lib.find(l=>l.id===id);if(!e)return;
  const n=(document.getElementById('en')?.value||'').trim();
  const sk=document.getElementById('es')?.value;
  const fo=document.getElementById('ef')?.value;
  const ca=sk==='Accessories'?(document.getElementById('ec')?.value||'back_bi'):'';
  const metric=document.getElementById('em')?.value||'reps';
  if(!n){notify('Enter a name');return;}
  const oldName=e.name;
  e.name=n;e.skill=sk;e.focus=fo;e.category=ca;e.metric=metric;
  // Propagate name change to all historical sessions and PRs so no data is lost
  if(oldName!==n){
    S.cycles.forEach(cyc=>cyc.sessions.forEach(sess=>(sess.exercises||[]).forEach(ex=>{if(ex.libId===id)ex.name=n;})));
    S.prs.forEach(pr=>{if(pr.exercise===oldName)pr.exercise=n;});
  }
  editExId=null;save();rlLib();notify('Updated: '+n+(oldName!==n?' — history updated':''));
}
function cancelEx(){editExId=null;rlLib();}
function toggleHomeGym(id){
  const e=S.lib.find(l=>l.id===id);if(!e)return;
  e.homeGym=!e.homeGym;save();rlLib();
  notify(e.homeGym?'Added to home gym library':'Removed from home gym library');
}
function toggleHomeGymDay(d){
  if(!S.homeGymDays)S.homeGymDays=[];
  const idx=S.homeGymDays.indexOf(d);
  if(idx>-1)S.homeGymDays.splice(idx,1);else S.homeGymDays.push(d);
  save();rv();
}
function delEx(id){
  if(editExId===id)editExId=null;
  const name=(S.lib.find(e=>e.id===id)||{}).name||'Exercise';
  S.lib=S.lib.filter(x=>x.id!==id);save();rlLib();notify('Deleted: '+name);
}
let libDelPending=null;
function libDelTap(id){
  if(libDelPending===id){libDelPending=null;delEx(id);}
  else{libDelPending=id;rlLib();setTimeout(()=>{if(libDelPending===id){libDelPending=null;rlLib();}},3000);}
}

// ─── PLAN / CYCLE VIEW ────────────────────────────────────────────────────────
function sessStructure(td,hr){
  const rows=[];
  const L=[{t:'me',l:'ME Squat/Pull'},{t:'func',l:'Carry'},{t:'legs',l:'Legs'},{t:'acc',l:'Accessory'},{t:'grip',l:'Grip'}];
  const S_=[{t:'push',l:'ME Push'},{t:'push',l:'Push'},{t:'acc',l:'Anterior'},{t:'acc',l:'Posterior'},{t:'acc',l:'Core'},{t:'neck',l:'Neck'},{t:'grip',l:'Grip'}];
  if(td===1)rows.push({type:'full',label:'Full Session',slots:[{t:'me',l:'ME Squat/Pull'},{t:'func',l:'Carry'},{t:'push',l:'ME Push'},{t:'grip',l:'Grip'},{t:'legs',l:'Legs Acc'},{t:'neck',l:'Neck'},{t:'acc',l:'Accessory'}]});
  else if(td===2){rows.push({type:'long',label:'Day 1 — Long',slots:L});rows.push({type:'short',label:'Day 2 — Short',slots:S_});}
  else if(td===3){rows.push({type:'long',label:'Day 1 — Long',slots:L});rows.push({type:'short',label:'Day 2 — Short',slots:S_});rows.push({type:'long',label:'Day 3 — Long',slots:L});}
  else{rows.push({type:'long',label:'Day 1 — Long',slots:L});rows.push({type:'short',label:'Day 2 — Short',slots:S_});rows.push({type:'long',label:'Day 3 — Long',slots:L});rows.push({type:'short',label:'Day 4 — Push/Carry',slots:[{t:'push',l:'ME Push'},{t:'func',l:'Carry'},{t:'grip',l:'Grip'},{t:'acc',l:'Accessory'}]});}
  if(hr)rows.push({type:'ruck',label:'Saturday Ruck',slots:[{t:'ruck',l:'Weight'},{t:'ruck',l:'Distance'},{t:'ruck',l:'Duration'}]});
  return rows;
}
function validateSel(selIds,td){
  const sel=S.lib.filter(e=>selIds.includes(e.id));
  const warns=[];
  if(td>0&&!sel.find(e=>e.skill==='Squat'||e.skill==='Pull'))warns.push('No main lifts selected — add at least one Squat or Pull');
  if(td>0&&!sel.find(e=>e.skill==='Push'))warns.push('No Push exercises selected');
  if(td>0&&!sel.find(e=>e.skill==='Accessories'&&e.category==='grip'))warns.push('No Grip exercises selected');
  return warns;
}
function togglePrev(){
  const b=document.getElementById('prev-body'),i=document.getElementById('prev-icon');if(!b||!i)return;
  const o=b.style.display!=='none';
  if(o){b.style.display='none';i.style.transform='';}
  else{b.style.display='block';i.style.transform='rotate(180deg)';renderPreview();}
}
function renderPreview(){
  const el=document.getElementById('prev-body');if(!el)return;
  const sel=S.sel||S.lib.map(e=>e.id);
  if(!sel.length){el.innerHTML='<div class="chart-empty">Select exercises first</div>';return;}
  const sessions=genCycle(sel,S.cw||4);
  let h='';
  for(let w=0;w<(S.cw||4);w++){
    h+=`<div class="lbl mb6 mt12">Week ${w+1}</div>`;
    [0,1,2,3,4].forEach(d=>{
      const sess=sessions.find(s=>s.week===w&&s.day===d);if(!sess)return;
      const tl=sess.type==='ruck'?'Saturday Ruck':`Day ${d+1} — ${sess.type==='short'?'Short':sess.type==='full'?'Full':'Long'}`;
      h+=`<div class="prev-sess"><div class="prev-hd">${tl}</div>`;
      if(sess.type==='ruck')h+=`<div class="prev-ex">■ Saturday Ruck</div>`;
      else sess.exercises.forEach(ex=>{h+=`<div class="prev-ex">■${ex.name} ${sb(ex.skill)}</div>`;});
      h+=`</div>`;
    });
  }
  el.innerHTML=h;
}
// ─── PLAN RECOMMENDATIONS ────────────────────────────────────────────────────
function getRecommendations(td,cw){
  const mePwk=td>=4?3:td<=1?1:2;
  const pushPwk={1:2,2:3,3:4,4:6}[td]||4;
  const gripPwk={1:1,2:2,3:3,4:4}[td]||3;
  const funcPwk={1:1,2:2,3:3,4:3}[td]||2;
  function r(n){const total=n*cw;return`${Math.min(2,total)}–${Math.min(Math.max(2,Math.ceil(total/2)),8)}`;}
  return{me:r(mePwk),push:r(pushPwk),grip:r(gripPwk),func:`1–${Math.min(3,funcPwk)}`,acc:`1–${Math.min(cw+1,5)}`};
}

function rlExSel(){
  const el=document.getElementById('exsel');if(!el)return;
  const sel=S.sel||[];
  const rec=getRecommendations(S.trainDays||3,S.cw||4);
  const recMap={me:rec.me,push:rec.push,func:rec.func,back_bi:rec.acc,chest_tri:rec.acc,delts:'1–2',legs:'1–2',neck:'1–2',grip:rec.grip,core:'1–2'};
  const cats=[
    {key:'me',label:'Main Lifts (Squat / Pull)',exs:S.lib.filter(e=>e.skill==='Squat'||e.skill==='Pull')},
    {key:'push',label:'Push — Max Effort',exs:S.lib.filter(e=>e.skill==='Push')},
    {key:'func',label:'Functional (Loaded Carries)',exs:S.lib.filter(e=>e.skill==='Functional')},
    {key:'back_bi',label:'Accessories — Back & Biceps',exs:S.lib.filter(e=>e.skill==='Accessories'&&e.category==='back_bi')},
    {key:'chest_tri',label:'Accessories — Chest & Triceps',exs:S.lib.filter(e=>e.skill==='Accessories'&&e.category==='chest_tri')},
    {key:'delts',label:'Accessories — Delts',exs:S.lib.filter(e=>e.skill==='Accessories'&&e.category==='delts')},
    {key:'legs',label:'Accessories — Legs',exs:S.lib.filter(e=>e.skill==='Accessories'&&e.category==='legs')},
    {key:'neck',label:'Accessories — Neck',exs:S.lib.filter(e=>e.skill==='Accessories'&&e.category==='neck')},
    {key:'grip',label:'Accessories — Grip',exs:S.lib.filter(e=>e.skill==='Accessories'&&e.category==='grip')},
    {key:'core',label:'Accessories — Core',exs:S.lib.filter(e=>e.skill==='Accessories'&&e.category==='core')}
  ];
  let h='';
  cats.forEach(cat=>{
    if(!cat.exs.length)return;
    const sc=cat.exs.filter(e=>sel.includes(e.id)).length;
    const hgc=cat.exs.filter(e=>e.homeGym).length;
    const cc=sc===0?'bad':sc===1?'warn':'ok';
    const isOpen=CO[cat.key]!==false;
    h+=`<div class="cat-sec">
      <div class="cat-hdr" onclick="toggleCat('${cat.key}')">
        <div class="cat-hdr-l">
          <span style="font-size:21px;color:var(--t2)">${isOpen?'▾':'▸'}</span>
          <span class="cat-name">${cat.label}</span>
          <span class="cat-cnt ${cc}">${sc}/${cat.exs.length}</span>
          ${hgc?`<span style="font-size:10px;color:#6dcc8a;font-family:var(--fn);font-weight:700">⌂${hgc}</span>`:''}
        </div>
        <div style="display:flex;gap:6px" onclick="event.stopPropagation()">
          <button class="cat-mini" onclick="catAll('${cat.key}',true)">All</button>
          <button class="cat-mini" onclick="catAll('${cat.key}',false)">None</button>
        </div>
      </div>
      <div class="rec-note">ℹRecommend ${recMap[cat.key]||rec.acc} for a ${S.cw||4}-week cycle</div>`;
    if(isOpen){
      h+=`<div class="cat-body">`;
      cat.exs.forEach(e=>{
        h+=`<label class="cat-ex"><input type="checkbox" ${sel.includes(e.id)?'checked':''} onchange="togSel('${e.id}',this.checked)">
          <span class="cat-ex-name">${e.name}</span>
          <div class="fwrap">${fb(e.focus)}${cb(e.category)}${e.homeGym?`<span style="font-size:11px;color:#6dcc8a;font-family:var(--fn);font-weight:700;letter-spacing:.04em">⌂</span>`:''}</div>
        </label>`;
      });
      h+=`</div>`;
    }
    h+=`</div>`;
  });
  if(!S.lib.length)h='<div class="chart-empty">Add exercises in Library first</div>';
  el.innerHTML=h;
}

function catAll(key,chk){
  const ACC_CATS=new Set(['back_bi','chest_tri','delts','legs','neck','grip','core']);
  const exs=S.lib.filter(e=>key==='me'?(e.skill==='Squat'||e.skill==='Pull'):key==='func'?e.skill==='Functional':ACC_CATS.has(key)?(e.skill==='Accessories'&&e.category===key):e.skill===key.charAt(0).toUpperCase()+key.slice(1));
  if(!S.sel)S.sel=[];
  if(chk)exs.forEach(e=>{if(!S.sel.includes(e.id))S.sel.push(e.id);});
  else S.sel=S.sel.filter(id=>!exs.map(e=>e.id).includes(id));
  save();rlExSel();
}
function catAllAll(chk){S.sel=chk?S.lib.map(e=>e.id):[];save();rlExSel();}
function togSel(id,chk){
  if(!S.sel)S.sel=[];
  if(chk&&!S.sel.includes(id))S.sel.push(id);
  else if(!chk)S.sel=S.sel.filter(x=>x!==id);
  save();rlExSel();
}

function setSupersetPair(cid,w,d,exId,pairLibId){
  const cyc=S.cycles.find(c=>c.id===cid);
  const pairLib=S.lib.find(l=>l.id===pairLibId);
  if(!cyc||!pairLib)return;
  const refEx=cyc.sessions.find(s=>s.week===w&&s.day===d)?.exercises.find(e=>e.id===exId);
  if(!refEx)return;
  const primaryLibId=refEx.libId;
  cyc.sessions.forEach(s=>{
    if(s.day!==d||s.week<w)return;
    const ex=s.exercises.find(e=>e.libId===primaryLibId);
    if(!ex)return;
    ex.supersetWith={id:uid(),libId:pairLib.id,name:pairLib.name,metric:pairLib.metric||'reps',weightMode:'kg',sets:ex.sets.map(()=>mkSet())};
  });
  if(!cyc.supersetPairs)cyc.supersetPairs=[];
  cyc.supersetPairs=cyc.supersetPairs.filter(p=>!(p.dayIdx===d&&p.primaryLibId===primaryLibId));
  cyc.supersetPairs.push({weekIdx:w,dayIdx:d,primaryLibId,pairLibId});
  save();closeOverlay('swov');rv();notify('Superset: '+refEx.name+' ⊕ '+pairLib.name);
}
function removeSupersetPair(cid,w,d,exId){
  const cyc=S.cycles.find(c=>c.id===cid);if(!cyc)return;
  const refEx=cyc.sessions.find(s=>s.week===w&&s.day===d)?.exercises.find(e=>e.id===exId);
  if(!refEx)return;
  const primaryLibId=refEx.libId;
  cyc.sessions.forEach(s=>{
    if(s.day!==d||s.week<w)return;
    const ex=s.exercises.find(e=>e.libId===primaryLibId);
    if(ex)ex.supersetWith=null;
  });
  if(cyc.supersetPairs)cyc.supersetPairs=cyc.supersetPairs.filter(p=>!(p.dayIdx===d&&p.primaryLibId===primaryLibId));
  save();rv();notify('Superset removed');
}
function applySupersetPairs(sessions,pairs){
  if(!pairs||!pairs.length)return;
  pairs.forEach(pair=>{
    sessions.forEach(s=>{
      if(s.day!==pair.dayIdx||s.week<pair.weekIdx)return;
      const ex=s.exercises.find(e=>e.libId===pair.primaryLibId);
      if(!ex||ex.supersetWith)return;
      const pairLib=S.lib.find(l=>l.id===pair.pairLibId);
      if(pairLib)ex.supersetWith={id:uid(),libId:pairLib.id,name:pairLib.name,metric:pairLib.metric||'reps',weightMode:'kg',sets:ex.sets.map(()=>mkSet())};
    });
  });
}

// ─── CYCLE MANAGEMENT ─────────────────────────────────────────────────────────
function siblingCycles(cid){
  const cyc=S.cycles.find(c=>c.id===cid);if(!cyc)return[cyc].filter(Boolean);
  const rid=cyc.rotationId||cid;
  return S.cycles.filter(c=>(c.rotationId||c.id)===rid).sort((a,b)=>(a.cycleNumber||1)-(b.cycleNumber||1));
}
function switchCycle(id){
  const cyc=S.cycles.find(c=>c.id===id);if(!cyc)return;
  S.cid=id;S.wk=Math.min(S.wk,cyc.weeks-1);S.dy=0;save();rv();
}
function applyManualAdditions(sessions,additions){
  if(!additions||!additions.length)return;
  additions.forEach(add=>{
    sessions.forEach(s=>{
      if(s.day!==add.dayIdx||s.week<add.weekIdx)return;
      (add.exercises||[]).forEach(libEx=>{
        if(s.exercises.find(x=>x.libId===libEx.libId&&x.role==='manual'))return;
        const lib=S.lib.find(l=>l.id===libEx.libId);
        if(!lib)return;
        const newEx=mkEx({...lib,role:'manual'});
        const sorted=[...s.exercises].sort((a,b)=>(a.sortOrder??exSkillOrder(a))-(b.sortOrder??exSkillOrder(b)));
        const insertIdx=libEx.position;
        let arr;
        if(insertIdx==null||insertIdx>=sorted.length)arr=[...sorted,newEx];
        else arr=[...sorted.slice(0,insertIdx),newEx,...sorted.slice(insertIdx)];
        arr.forEach((e,i)=>e.sortOrder=i);
        s.exercises=arr;
      });
    });
  });
}
function startNextCycle(cid){
  const prev=S.cycles.find(c=>c.id===cid);if(!prev)return;
  const cn=(prev.cycleNumber||1)+1;
  const id=uid();
  const sessions=genCycle(prev.selIds,prev.weeks);
  applyManualAdditions(sessions,prev.manualAdditions||[]);
  applySupersetPairs(sessions,prev.supersetPairs||[]);
  const baseName=(prev.name||'Block').replace(/\s*—\s*Cycle \d+$/,'').trim();
  const cyc={id,name:baseName+(cn>1?` — Cycle ${cn}`:''),
    rotationId:prev.rotationId||prev.id,cycleNumber:cn,
    startDate:new Date().toLocaleDateString('en-GB'),
    weeks:prev.weeks,trainDays:prev.trainDays||3,hasRuck:prev.hasRuck!==false,
    homeGymDays:[...(prev.homeGymDays||[])],sessions,selIds:[...prev.selIds],
    manualAdditions:JSON.parse(JSON.stringify(prev.manualAdditions||[])),
    supersetPairs:JSON.parse(JSON.stringify(prev.supersetPairs||[]))
  };
  S.cycles.push(cyc);S.cid=cyc.id;S.wk=0;S.dy=0;
  save();nav('train');notify(`Cycle ${cn} started!`);
}

function doAddEx(cid,w,d,libId){
  const cyc=S.cycles.find(c=>c.id===cid);
  const lib=S.lib.find(l=>l.id===libId);
  if(!cyc||!lib)return;
  const posVal=document.getElementById('add-pos')?.value;
  const insertIdx=(posVal===undefined||posVal==='end')?null:parseInt(posVal);
  // Add to current session + all future sessions of same day from this week, at chosen position
  cyc.sessions.forEach(s=>{
    if(s.day!==d||s.week<w)return;
    if(s.exercises.find(x=>x.libId===libId&&x.role==='manual'))return;
    const newEx=mkEx({...lib,role:'manual'});
    const sorted=[...s.exercises].sort((a,b)=>(a.sortOrder??exSkillOrder(a))-(b.sortOrder??exSkillOrder(b)));
    let arr;
    if(insertIdx==null||insertIdx>=sorted.length)arr=[...sorted,newEx];
    else arr=[...sorted.slice(0,insertIdx),newEx,...sorted.slice(insertIdx)];
    arr.forEach((e,i)=>e.sortOrder=i);
    s.exercises=arr;
  });
  // Store for future cycles (keyed by week+day), including chosen position
  if(!cyc.manualAdditions)cyc.manualAdditions=[];
  let slot=cyc.manualAdditions.find(a=>a.weekIdx===w&&a.dayIdx===d);
  if(!slot){slot={weekIdx:w,dayIdx:d,exercises:[]};cyc.manualAdditions.push(slot);}
  if(!slot.exercises.find(e=>e.libId===libId))
    slot.exercises.push({libId,name:lib.name,skill:lib.skill,focus:lib.focus,category:lib.category||'',metric:lib.metric||'reps',position:insertIdx});
  save();closeOverlay('swov');rv();notify('Added: '+lib.name);
}


function getDayLabels(cyc){
  return cyc.sessions.filter(s=>s.week===0).sort((a,b)=>a.day-b.day)
    .map(s=>s.type==='ruck'?'Ruck':s.type==='full'?'Train':`Day ${s.day+1}`);
}
function maxDay(cyc){return(cyc.sessions.filter(s=>s.week===0).length)-1;}
function weekDot(cyc,w){
  const sess=cyc.sessions.filter(s=>s.week===w);const wt=sess.length;
  const wd=sess.filter(s=>s.done).length;
  const wm=sess.filter(s=>s.missed).length;
  if(wd===wt&&wt>0)return'<span class="dot-done"></span>';
  if(wm>0&&wd+wm===wt)return'<span class="dot-miss"></span>';
  if(wd>0||wm>0)return'<span class="dot-part"></span>';
  return'<span class="dot-none"></span>';
}
function playDoneTone(){
  try{
    const ac=new(window.AudioContext||window.webkitAudioContext)();
    function tone(freq,t,dur,vol=0.6){const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=freq;o.type='triangle';g.gain.setValueAtTime(vol,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+t+dur);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+dur+0.05);}
    // Rising triad — resolving, satisfying, not alarm-like
    tone(523,0,0.18);tone(659,0.2,0.18);tone(784,0.4,0.3);
  }catch(e){}
  if(navigator.vibrate)navigator.vibrate([80,60,80]);
}
function playMissTone(){
  try{
    const ac=new(window.AudioContext||window.webkitAudioContext)();
    function tone(freq,t,dur,vol=0.55){const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=freq;o.type='sawtooth';g.gain.setValueAtTime(vol,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+t+dur);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+dur+0.05);}
    // Descending minor — resolves downward, distinctly negative
    tone(196,0,0.22);tone(155,0.25,0.22);tone(116,0.5,0.35);
  }catch(e){}
  if(navigator.vibrate)navigator.vibrate([200,80,200]);
}
function flashMissed(cid,w,d){

    const el=document.getElementById(`miss-area-${cid}-${w}-${d}`);
    if(!el)return;
    const W=el.offsetWidth,H=el.offsetHeight;
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('width',W);svg.setAttribute('height',H);
    svg.style.cssText=`position:absolute;inset:0;pointer-events:none;z-index:5;overflow:visible`;
    const rect=document.createElementNS('http://www.w3.org/2000/svg','rect');
    const perim=2*(W+H);
    [['x','1'],['y','1'],['width',W-2],['height',H-2],['rx','6'],['fill','none'],['stroke','rgba(224,60,60,.9)'],['stroke-width','1.5'],['stroke-dasharray',perim],['stroke-dashoffset',perim]].forEach(([k,v])=>rect.setAttribute(k,v));
    svg.appendChild(rect);
    el.style.position='relative';

    setTimeout(()=>{rect.style.transition='opacity .4s ease';rect.style.opacity='0';setTimeout(()=>svg.remove(),420);},760);
  },60);
}

// ─── SESSION COMPARISON ───────────────────────────────────────────────────────
function toggleCompare(){showCompare=!showCompare;rv();}

function getPrevSession(cycId,week,day){
  const siblings=siblingCycles(cycId);
  const idx=siblings.findIndex(c=>c.id===cycId);
  if(idx>0){
    const pc=siblings[idx-1];
    const prev=pc.sessions.find(s=>s.week===week&&s.day===day);
    if(prev)return{sess:prev,label:`Cycle ${pc.cycleNumber||idx} · W${week+1}`,cycNum:pc.cycleNumber||idx,wasMissed:prev.missed||false,wasDeload:isDeload(pc.id,week)};
  }
  return null;
}

function rComparePanel(cycId,week,day){
  const prev=getPrevSession(cycId,week,day);if(!prev)return'';
  const {sess,label,wasMissed,wasDeload}=prev;
  const banners=(wasMissed?`<div class="warn-banner" style="border-color:#c04040;color:#e06060">⊘ Session was missed — no weights logged</div>`:'')+
    (wasDeload?`<div class="warn-banner" style="border-color:var(--gd);color:var(--g)">↓ This was a deload week — reduced weights shown. Targets for this cycle use pre-deload bests.</div>`:'');
  if(sess.type==='ruck'){
    const r=sess.ruckData||{};
    return`<div class="cmp-panel">${banners}
      <div class="cmp-hdr">↺${label}</div>
      <div class="cmp-row"><span class="cmp-name">Ruck</span><span class="cmp-val">${r.distance?r.distance+ruDist():'—'}${r.weight?' · '+r.weight+uw():''}${r.duration?' · '+r.duration:''}</span></div>
    </div>`;
  }
  const rows=(sess.exercises||[]).map(ex=>{
    const sets=ex.sets||[];
    const logged=sets.filter(s=>parseFloat(s.weight)>0);
    if(!logged.length)return`<div class="cmp-row"><span class="cmp-name">${ex.name}</span><span class="cmp-val" style="color:var(--t2)">no data</span></div>`;
    const mSfx=ex.metric==='metres'?'m':ex.metric==='seconds'?'s':ex.metric==='minutes'?'min':'r';
    let summary;
    if(ex.wuMode&&ex.topSetIdx!=null&&sets[ex.topSetIdx]){
      const ts=sets[ex.topSetIdx];
      summary=`${logged.length} attempt${logged.length>1?'s':''} → <strong>${ts.weight}${uw()} × ${ts.reps}${mSfx}</strong>${ts.rpe?' · RPE '+ts.rpe:''}`;
    } else {
      summary=logged.map(s=>{
        const p=[`<strong>${s.weight}${uw()}</strong>`];
        if(s.reps)p.push('×'+s.reps+mSfx);
        if(s.sets&&parseInt(s.sets)>1)p.push('×'+s.sets+' sets');
        if(s.rpe)p.push('RPE '+s.rpe);
        return p.join(' ');
      }).join(' &nbsp;·&nbsp; ');
    }
    return`<div class="cmp-row"><span class="cmp-name">${ex.name}</span><span class="cmp-val">${summary}</span></div>`;
  }).filter(Boolean).join('');
  return`<div class="cmp-panel">${banners}
    <div class="cmp-hdr">↺${label}${sess.notes?` · <em style="font-weight:400;color:var(--t2)">${sess.notes.slice(0,40)}${sess.notes.length>40?'…':''}</em>`:''}
    </div>${rows||'<div style="color:var(--t2);font-size:13px;padding:4px 0">No exercises logged</div>'}
  </div>`;
}

function vTrain(c){
  const cyc=S.cycles.find(x=>x.id===S.cid);
  if(!cyc){c.innerHTML=`<div class="empty">⊛<h3>No Active Cycle</h3><p><button class="btnp mt8" onclick="nav('cyc')">Plan Cycle →</button></p></div>`;return;}
  const siblings=siblingCycles(S.cid);
  const isLatest=!siblings.length||siblings[siblings.length-1].id===S.cid;
  const nextCycNum=(cyc.cycleNumber||1)+1;
  const dLbls=getDayLabels(cyc),mx=maxDay(cyc);
  const canP=S.wk>0||S.dy>0,canN=S.wk<cyc.weeks-1||S.dy<mx;
  const pL=S.dy>0?dLbls[S.dy-1]:(S.wk>0?'W'+(S.wk)+' '+dLbls[mx]:'');
  const nL=S.dy<mx?dLbls[S.dy+1]:(S.wk<cyc.weeks-1?'W'+(S.wk+2)+' '+dLbls[0]:'');
  const dl=isDeload(S.cid,S.wk);
  let h=`<div class="stitle">Training</div>`;
  // Cycle pills
  if(siblings.length>0){

  h+=`<div class="pnav">
    ${Array.from({length:cyc.weeks},(_,w)=>`<div class="pill ${dl&&w===S.wk?'dl ':''} ${S.wk===w?'on':''}" onclick="setWk(${w})">${weekDot(cyc,w)} W${w+1}${(S.deloadWeeks?.[S.cid]||[]).includes(w)?' ↓':''}</div>`).join('')}

    <div class="pnav" style="flex:1;margin-bottom:0;flex-wrap:nowrap">

    </div>

      <span style="font-size:13px">${dl?'↓':'↓'}</span>${dl?'Deload ✓':'Deload?'}
    </button>
  </div>

    <div class="swp-btn l" onclick="${canP?'prvDay()':''}" style="${canP?'':'opacity:.2;pointer-events:none'}">‹${pL}</div>
    <div class="swp-cur">${siblings.length>1?`C${cyc.cycleNumber||1}·`:''}W${S.wk+1}·${dLbls[S.dy]||'?'}</div>
    <div class="swp-btn r" onclick="${canN?'nxtDay()':''}" style="${canN?'':'opacity:.2;pointer-events:none'}">${nL}›</div>
  </div>`;
  const sess=cyc.sessions.find(s=>s.week===S.wk&&s.day===S.dy);

  if(dl)h+=`<div class="deload-bar">↓ DELOAD WEEK — Reduced load · Technique focus</div>`;
  const sessTypeLabel={long:'Long Session',short:'Short Session',full:'Full Session',ruck:'Saturday Ruck'}[sess.type]||sess.type;
  const prevSess=getPrevSession(cyc.id,sess.week,sess.day);

      <span class="bdg ${sess.type==='ruck'?'bruck':sess.type==='short'?'bde':'bme'}">${sessTypeLabel}</span>
      ${sessIsHG?`<span class="hg-badge">⌂ Home Gym</span>`:''}
      ${sess.missed?`<span class="bdg" style="background:rgba(160,40,40,.2);border:1px solid #c04040;color:#e06060">MISSED</span>`:''}
    </div>
    <div style="display:flex;gap:6px">
      ${prevSess?`<button class="btn btns ${showCompare?'btnon':''}" onclick="toggleCompare()">↺${prevLabel}</button>`:''}
      <button class="btn btns ${sess.missed?'btnon':''}${sess.missed?' btnd':''}" id="miss-area-${cyc.id}-${sess.week}-${sess.day}" onclick="togMissed('${cyc.id}',${sess.week},${sess.day})" style="${sess.missed?'border-color:#c04040;color:#e06060':''}">
        ✕ ${sess.missed?'Missed':'Miss?'}
      </button>
      <button class="btn btns ${sess.done?'btnon':''}" id="done-area-${cyc.id}-${sess.week}-${sess.day}" onclick="togDone('${cyc.id}',${sess.week},${sess.day})" ${sess.missed?'style="opacity:.4;pointer-events:none"':''}>
        <span>${sess.done?'✓':'○'}</span> ${sess.done?'Done':'Mark Done'}
      </button>

  if(showCompare&&prevSess)h+=rComparePanel(cyc.id,sess.week,sess.day);

  h+=`<div class="card mb12">
    <div class="lbl">Session Notes</div>
    <textarea placeholder="Readiness, modifications, how it went…" oninput="updSessNotes('${cyc.id}',${sess.week},${sess.day},this.value)">${sess.notes||''}</textarea>
  </div>`;
  h+=sess.type==='ruck'?rRuck(sess,cyc.id):rSess(sess,cyc.id);
  // Add exercise button
  if(sess.type!=='ruck'){
    h+=`<button class="btn btns mt8 mb12" style="width:100%" onclick="addExToSession('${cyc.id}',${sess.week},${sess.day})">
      + Add Exercise to Session
    </button>`;
  }
  c.innerHTML=h;
}

// ─── SKILL ORDER + PR LOGGING ─────────────────────────────────────────────────
const SKILL_ORDER={Squat:0,Pull:1,Functional:2,Push:3,Accessories:4,Grip:5};
const ROLE_SORT={main:0,func:1,main_push:2,push2:3,legs_acc:4,acc:5,acc2:6,core_acc:7,neck:8,grip:9,manual:10};
function exSkillOrder(ex){return ROLE_SORT[ex.role]!==undefined?ROLE_SORT[ex.role]:SKILL_ORDER[ex.skill]??10;}
function logSetAsPR(name,cid,w,d,eid,si){
  const ex=gEx(cid,w,d,eid);if(!ex||!ex.sets[si])return;
  const s=ex.sets[si];
  if(s.failed){notify('Cannot log a missed lift as a PR');return;}
  const kg=parseFloat(s.weight),reps=parseInt(s.reps);
  if(!kg||!reps){notify('Fill in weight and '+metricLbl(ex.metric||'reps')+' first');return;}
  const notes=s.notes||'';
  S.prs.push({id:uid(),exercise:name,kg,reps,date:new Date().toLocaleDateString('en-GB'),notes});
  save();notify('★ PR logged — '+name+' '+kg+uw()+' × '+reps+(ex.metric==='metres'?'m':ex.metric==='seconds'?'s':'r'));
}
function rSess(sess,cid){
  if(!sess.exercises.length)return'<div class="empty">—<h3>No exercises planned</h3></div>';
  const sorted=[...sess.exercises].sort((a,b)=>(a.sortOrder??exSkillOrder(a))-(b.sortOrder??exSkillOrder(b)));
  return sorted.map(ex=>rEx(ex,sess,cid)).join('');
}

let exCollapsed={};
function toggleExCollapse(exId,e){e&&e.stopPropagation();exCollapsed[exId]=!exCollapsed[exId];rv();}
let exNotesOpen={};
function toggleExNotes(exId){exNotesOpen[exId]=!exNotesOpen[exId];rv();}
let exDelPending={};
function removeExFromSession(cid,w,d,exId){
  if(!exDelPending[exId]){exDelPending[exId]=true;rv();return;}
  const c=S.cycles.find(x=>x.id===cid);if(!c)return;
  const sess=c.sessions.find(s=>s.week===w&&s.day===d);if(!sess)return;
  sess.exercises=sess.exercises.filter(e=>e.id!==exId);
  sess.exercises.forEach((e,i)=>e.sortOrder=i);
  delete exDelPending[exId];
  save();rv();
}
function notesPanel(ex,cid,w,d){
  if(!exNotesOpen[ex.id])return'';
  const sets=ex.sets||[];
  let h=`<div class="card-i mb8" style="background:rgba(255,255,255,.02);border-color:var(--gd)">
    <div class="lbl mb6">📝 Set Notes — ${ex.name}</div>`;
  sets.forEach((s,si)=>{
    const tag=ex.wuMode?(si===ex.topSetIdx?' · Top Set':(ex.topSetIdx!=null&&si>ex.topSetIdx?' · Back-off':(ex.topSetIdx!=null&&si<ex.topSetIdx?' · Attempt':''))):'';
    h+=`<div class="sf mb6"><label>Set ${si+1}${tag}${s.weight?` — ${s.weight}${wLabel(ex)}${s.reps?' × '+s.reps:''}`:''}</label>
      <input value="${s.notes||''}" placeholder="Add note for this set…" style="${failStyle(s)}" oninput="upd('${cid}',${w},${d},'${ex.id}',${si},'notes',this.value)"></div>`;
  });
  if(ex.supersetWith){
    h+=`<div class="lbl mb6 mt8" style="color:var(--gd)">B · ${ex.supersetWith.name}</div>`;
    (ex.supersetWith.sets||[]).forEach((s,si)=>{
      h+=`<div class="sf mb6"><label>Set ${si+1}${s.weight?` — ${s.weight}${wLabel(ex.supersetWith)}${s.reps?' × '+s.reps:''}`:''}</label>
        <input value="${s.notes||''}" placeholder="Add note for this set…" oninput="updSS('${cid}',${w},${d},'${ex.id}',${si},'notes',this.value)"></div>`;
    });
  }
  h+=`</div>`;
  return h;
}


function moveEx(cid,w,d,exId,dir){
  const c=S.cycles.find(x=>x.id===cid);if(!c)return;
  const s=c.sessions.find(s=>s.week===w&&s.day===d);if(!s)return;
  const sorted=[...s.exercises].sort((a,b)=>(a.sortOrder??exSkillOrder(a))-(b.sortOrder??exSkillOrder(b)));
  const idx=sorted.findIndex(e=>e.id===exId);
  const newIdx=idx+dir;
  if(idx<0||newIdx<0||newIdx>=sorted.length)return;
  [sorted[idx],sorted[newIdx]]=[sorted[newIdx],sorted[idx]];
  sorted.forEach((e,i)=>e.sortOrder=i);
  s.exercises=sorted;
  save();rv();
}
function moveBtns(ex,sess,cid){
  const sorted=[...sess.exercises].sort((a,b)=>(a.sortOrder??exSkillOrder(a))-(b.sortOrder??exSkillOrder(b)));
  const idx=sorted.findIndex(e=>e.id===ex.id);
  const canUp=idx>0,canDown=idx<sorted.length-1;
  return`<div class="move-col">
    <button class="move-btn" ${canUp?'':'style="opacity:.25;pointer-events:none"'} onclick="moveEx('${cid}',${sess.week},${sess.day},'${ex.id}',-1)" title="Move up">▲</button>
    <button class="move-btn" ${canDown?'':'style="opacity:.25;pointer-events:none"'} onclick="moveEx('${cid}',${sess.week},${sess.day},'${ex.id}',1)" title="Move down">▼</button>
  </div>`;
}
function rEx(ex,sess,cid){

        <div style="display:flex;gap:5px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end">
          ${isMainLift?`<button class="sw-btn" onclick="toggleFocus('${cid}',${sess.week},${sess.day},'${ex.id}')" title="ME/DE">${ex.focus==='Max Effort'?'ME':'DE'}</button>`:''}
          <button class="sw-btn" title="Switch weight label" onclick="setWMode('${cid}',${sess.week},${sess.day},'${ex.id}')">${ex.weightMode||'kg'}</button>
          <button class="sw-btn" onclick="openSwap('${cid}',${sess.week},${sess.day},'${ex.id}')">Swap</button>
          <button class="collapse-btn" onclick="toggleExCollapse('${ex.id}',event)" title="${exCollapsed[ex.id]?'Expand':'Collapse'}">${exCollapsed[ex.id]?'▸':'▾'}</button>
        </div>
      </div>
      <div class="fwrap mt8">${sb(ex.skill)}${fb(ex.focus)}${cb(ex.category)}${metricBadge(exMetric)}<span id="orm-${ex.id}" class="orm-bdg" style="${orm?'':'display:none'}">≈1RM ${orm||''}${uw()}</span></div>
    </div>
    <div class="exby ${exCollapsed[ex.id]?'exby-collapsed':''}">
    ${notesPanel(ex,cid,sess.week,sess.day)}`;
  if(tgt)h+=`<div class="tgt ${tgt.isDeload?'dl':''}">
    <span class="tgt-icon" style="${tgt.isDeload?'color:var(--g)':''}">${tgt.isDeload?'↓':'↑'}</span>
    <div class="tgt-body">
      <div class="tgt-t">${tgt.isDeload?'Deload Target':'Suggested Target'}</div>
      <div class="tgt-v">${tgt.kg}${tgt.suffix!==undefined?tgt.suffix:uw()} × ${tgt.reps}${exMetric==='reps'?'r':exMetric==='metres'?'m':exMetric==='seconds'?'s':'min'}</div>
      <div class="tgt-p">${tgt.note}</div>
      <div style="color:var(--green);font-size:11px;margin-top:5px;line-height:1.5;font-family:var(--fn)">Last time: ${tgt.pKg}${tgt.suffix!==undefined?tgt.suffix:uw()} × ${tgt.pReps}${exMetric==='reps'?'r':exMetric==='metres'?'m':exMetric==='seconds'?'s':'min'}${tgt.pSets&&parseInt(tgt.pSets)>1?` × ${tgt.pSets} sets`:''}${tgt.pEquipment?` · ${tgt.pEquipment}`:''}${tgt.pNotes?`<br>“${tgt.pNotes}”`:''}</div>
    </div>
    <button class="tgt-app ${tgt.isDeload?'dl':''}" onclick="applyTgt('${cid}',${sess.week},${sess.day},'${ex.id}',${tgt.kg},${tgt.reps})">Apply</button>
  </div>`;
  h+=`<div class="lbl mb6">Equipment</div>
    <input class="ins mb12" value="${(ex.sets[0]||{}).equipment||''}" placeholder="Barbell, SSB, Chains…" oninput="upd('${cid}',${sess.week},${sess.day},'${ex.id}',0,'equipment',this.value)">
    <div class="lbl mb6">Sets</div>`;
  ex.sets.forEach((s,si)=>{
    const isReps=exMetric==='reps';
    h+=`<div class="setc ${s.failed?'failed':''}">
      <div class="sr1">
        <div class="snum">${si+1}</div>
        <div class="sf"><label>${wLabel(ex)}</label><input type="number" inputmode="decimal" value="${s.weight}" placeholder="0" style="${failStyle(s)}"
          oninput="upd('${cid}',${sess.week},${sess.day},'${ex.id}',${si},'weight',this.value)"
          ${isReps?`onblur="prCheck('${ex.name}','${cid}',${sess.week},${sess.day},'${ex.id}',${si})"`:''}>
        </div>
        <div class="sf"><label>${repLbl}</label><input type="number" inputmode="${repMode}" value="${s.reps}" placeholder="0" style="${failStyle(s)}"
          oninput="upd('${cid}',${sess.week},${sess.day},'${ex.id}',${si},'reps',this.value)"></div>
        <div class="sf"><label>Sets</label><input type="number" inputmode="numeric" value="${s.sets||''}" placeholder="1" title="How many sets performed" style="${failStyle(s)}"
          oninput="upd('${cid}',${sess.week},${sess.day},'${ex.id}',${si},'sets',this.value)"></div>

          oninput="upd('${cid}',${sess.week},${sess.day},'${ex.id}',${si},'rest',this.value)"></div>
        <div class="sf"><label>Notes</label><input value="${s.notes||''}" placeholder="…"
          oninput="upd('${cid}',${sess.week},${sess.day},'${ex.id}',${si},'notes',this.value)"></div>
      </div>
      <div style="display:flex;gap:6px;margin-top:8px">
        <button class="rest-btn" style="flex:1;margin-top:0" onclick="startRest('${cid}',${sess.week},${sess.day},'${ex.id}',${si})">

        <button class="fail-btn ${s.failed?'on':''}" onclick="toggleFail('${cid}',${sess.week},${sess.day},'${ex.id}',${si})">
          ✕${s.failed?' MISSED':' MISS?'}
        </button>
      </div>
    </div>`;
  });
  h+=`<button class="btn btns" style="width:100%;margin-top:4px" onclick="addSet('${cid}',${sess.week},${sess.day},'${ex.id}')">+ Add Set</button>
  ${isAcc?`<button class="btn btns" style="width:100%;margin-top:4px;color:var(--gd);border-color:var(--gd)" onclick="openSupersetPicker('${cid}',${sess.week},${sess.day},'${ex.id}')">⊕ Add Superset Partner</button>`:''}
  <button class="btn btns" style="width:100%;margin-top:8px;${exDelPending[ex.id]?'color:#e06060;border-color:#c04040':''}" onclick="removeExFromSession('${cid}',${sess.week},${sess.day},'${ex.id}')">
    ${exDelPending[ex.id]?'⚠ Confirm Remove?':'− Remove Exercise'}
  </button>
  </div></div>`;
  return h;
}

function rSSEx(ex,sess,cid){
  const ss=ex.supersetWith;
  if(!ss.sets||ss.sets.length!==ex.sets.length)ss.sets=ex.sets.map((_,i)=>ss.sets?.[i]||mkSet());

          <button class="sw-btn" onclick="openSwap('${cid}',${sess.week},${sess.day},'${ex.id}')">Swap A</button>
          <button class="collapse-btn" onclick="toggleExCollapse('${ex.id}',event)" title="${exCollapsed[ex.id]?'Expand':'Collapse'}">${exCollapsed[ex.id]?'▸':'▾'}</button>
        </div>
      </div>
    </div>
    <div class="exby ${exCollapsed[ex.id]?'exby-collapsed':''}">
    ${notesPanel(ex,cid,sess.week,sess.day)}`;
  if(tgt)h+=`<div class="tgt ${tgt.isDeload?'dl':''}">
    <span class="tgt-icon" style="${tgt.isDeload?'color:var(--g)':''}">${tgt.isDeload?'↓':'↑'}</span>

    <div class="tgt-v">${tgt.kg}${tgt.suffix!==undefined?tgt.suffix:uw()} × ${tgt.reps}r</div><div class="tgt-p">${tgt.note}</div>
    <div style="color:var(--green);font-size:11px;margin-top:5px;line-height:1.5;font-family:var(--fn)">Last time: ${tgt.pKg}${tgt.suffix!==undefined?tgt.suffix:uw()} × ${tgt.pReps}r${tgt.pSets&&parseInt(tgt.pSets)>1?` × ${tgt.pSets} sets`:''}${tgt.pEquipment?` · ${tgt.pEquipment}`:''}${tgt.pNotes?`<br>“${tgt.pNotes}”`:''}</div></div>
    <button class="tgt-app ${tgt.isDeload?'dl':''}" onclick="applyTgt('${cid}',${sess.week},${sess.day},'${ex.id}',${tgt.kg},${tgt.reps})">Apply</button>
  </div>`;
  // Column headers
  h+=`<div class="ss-grid">
    <div class="ss-col-hdr ss-a" style="border-color:var(--g2)">A · ${ex.name}</div>
    <div class="ss-col-hdr ss-b" style="border-color:var(--gd)">B · ${ss.name}</div>
  </div>`;
  // Set rows
  ex.sets.forEach((sa,si)=>{
    const sb_=ss.sets[si]||mkSet();
    h+=`<div class="ss-grid" style="margin-bottom:2px">
      <div class="setc ${sa.failed?'failed':''}">
        <div style="display:flex;gap:4px;align-items:center">
          <div class="snum" style="color:var(--g2)">${si+1}</div>

              oninput="upd('${cid}',${sess.week},${sess.day},'${ex.id}',${si},'weight',this.value)"
              onblur="prCheck('${ex.name}','${cid}',${sess.week},${sess.day},'${ex.id}',${si})">
          </div>
          <div class="sf" style="flex:1"><label>${metricLbl(aMetric)}</label>
